<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doorks — Job Workflow Review</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#1e2b23;background:#f5f7f5}body{max-width:1120px;margin:30px auto;padding:0 18px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}a{color:#265c3c}h1{font-size:26px}form{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}input,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #b7c8bd}input{flex:1;min-width:180px}button{background:#27653f;color:white;cursor:pointer}button:disabled{opacity:.6}#message{min-height:25px}#results{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{background:white;border:1px solid #d9e4dc;border-radius:12px;padding:17px}.card h2{font-size:17px;margin:0 0 10px}.meta{color:#51635a;font-size:13px}.issue{color:#9a3e2a}.ok{color:#28643d}ul{padding-left:20px;overflow-wrap:anywhere}li{margin:5px 0}#notes{margin-top:18px;white-space:pre-wrap}.summary{background:#fff;border:1px solid #d9e4dc;border-radius:12px;padding:16px;margin:12px 0}.muted{color:#687b70}.attention{color:#95592c}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.actions button{background:#f5f7f5;color:#265c3c}.actions button:disabled{opacity:.45}</style><link rel="stylesheet" href="/static/doorks_visual_polish.css?v=122"></head><body>
<header><div><h1>Job Workflow Review</h1><p>Read-only verification of explicitly linked Doorks records.</p></div><a href="/">Back to Doorks</a></header>
<form id="lookup"><input id="job" name="job" required maxlength="80" placeholder="Enter exact job number, e.g. 1126-01" aria-label="Job number"><button id="run" type="submit">Review Job</button></form>
<p id="message" role="status" aria-live="polite">Enter a job number to review.</p><div class="actions"><button type="button" id="copy" disabled>Copy Review Summary</button><span class="meta">Missing links may be optional; this review does not post transactions.</span></div><section id="summary" aria-label="Review summary"></section><section id="results" aria-label="Workflow stage results"></section><section id="notes" class="meta"></section>
<script>
const form=document.getElementById('lookup'),job=document.getElementById('job'),button=document.getElementById('run'),results=document.getElementById('results'),message=document.getElementById('message'),notes=document.getElementById('notes'),summary=document.getElementById('summary'),copy=document.getElementById('copy');let lastSummary='';
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=String(text);if(cls)e.className=cls;return e;}
function card(title,detail){const c=el('article',undefined,'card');c.append(el('h2',title));if(detail)c.append(el('p',detail,'meta'));results.append(c);return c;}
copy.addEventListener('click',async()=>{if(!lastSummary)return;try{await navigator.clipboard.writeText(lastSummary);message.textContent='Review summary copied.';}catch{message.textContent='Copy unavailable in this browser; select the review text instead.';}});
function lines(c,items){const ul=el('ul');for(const item of items)ul.append(el('li',item));c.append(ul);}
form.addEventListener('submit',async e=>{e.preventDefault();const number=job.value.trim();if(!number)return;button.disabled=true;copy.disabled=true;lastSummary='';results.replaceChildren();notes.replaceChildren();summary.replaceChildren();message.textContent='Reviewing '+number+'…';try{const r=await fetch('/doorks-operations/workflow-handoffs/'+encodeURIComponent(number),{credentials:'same-origin'});if(!r.ok)throw Error(r.status===401||r.status===403?'Office login required to review workflow.':'Unable to review job (HTTP '+r.status+').');const data=await r.json();message.textContent='Results for '+data.job_number;
const checks=data.checks||[],missing=checks.filter(x=>!x.has_explicit_link),financial=data.financial_reconciliation||{},warnings=financial.issues||[],receiving=data.receiving_balances||[];
const flagged=receiving.filter(x=>x.reason||x.status==='Over Received');
const summaryBox=el('div',undefined,'summary');summaryBox.append(el('strong','Review overview'));
summaryBox.append(el('p',checks.filter(x=>x.has_explicit_link).length+' of '+checks.length+' stages have explicit record links. '+missing.length+' stages have no explicit link (some may not apply).','meta'));
summaryBox.append(el('p',warnings.length+' financial warning(s); '+flagged.length+' receiving exception(s).',warnings.length||flagged.length?'attention':'ok'));
summary.append(summaryBox);
for(const check of checks){const c=card(check.label,(check.linked_records||0)+' explicitly linked record(s)');c.append(el('p',check.has_explicit_link?'Linked':'No explicit link found — may be optional',check.has_explicit_link?'ok':'muted'));}
lastSummary=['Doorks Job Workflow Review — '+data.job_number,'Read-only; no transactions posted.',...checks.map(x=>x.label+': '+(x.linked_records||0)+' linked record(s)'),...receiving.map(x=>'Receiving '+(x.po_number||x.po_id||'')+': '+(x.reason||x.status||'unknown')),...warnings.map(x=>'Financial warning: '+x),data.note||''].join('\n');copy.disabled=false;for(const po of data.receiving_balances||[]){const c=card('Receiving: '+(po.po_number||po.po_id),po.status);if(po.reason)c.append(el('p',po.reason,'issue'));else if(po.status==='Over Received')c.append(el('p','Received quantity exceeds ordered quantity — review this purchase order.','issue'));if(!po.reason)lines(c,['Ordered: '+po.ordered,'Received: '+po.received,'Outstanding: '+po.outstanding]);}const fin=data.financial_reconciliation||{};const c=card('Financial reconciliation','Read-only, not proof of settlement');lines(c,['Invoices: '+(fin.invoice_count||0),'Matched receivables: '+(fin.matched_receivable_count||0),'Posted allocations: '+(fin.posted_allocation_count||0),'Supplier bills: '+(fin.supplier_bill_count||0)]);for(const issue of fin.issues||[])c.append(el('p',issue,'issue'));notes.textContent=(data.note||'')+'\n'+(fin.note||'');}catch(err){message.textContent=err.message;}finally{button.disabled=false;}});
</script></body></html>

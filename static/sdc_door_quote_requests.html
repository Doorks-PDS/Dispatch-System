<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Door Quote Requests · SDC</title>
<style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f7f4;color:#25382d}*{box-sizing:border-box}body{margin:0;padding:22px}main{max-width:1210px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}.eyebrow{font-size:11px;letter-spacing:.13em;color:#60816a;font-weight:900}h1{font-size:29px;letter-spacing:-.04em;margin:4px 0}h2{font-size:18px;margin:0 0 12px}.links{display:flex;flex-wrap:wrap;gap:8px}.button,button{display:inline-flex;align-items:center;justify-content:center;font:inherit;font-size:13px;font-weight:700;padding:10px 13px;border:1px solid #bdd2c4;border-radius:10px;background:white;color:#26543d;text-decoration:none;cursor:pointer}button.primary{background:#29583d;color:white}.layout{display:grid;grid-template-columns:minmax(260px,.75fr) minmax(0,1.25fr);gap:16px}.panel{background:#fff;border:1px solid #dbe6dd;border-radius:17px;padding:19px}.list{display:grid;gap:9px;max-height:75vh;overflow-y:auto}.item{text-align:left;display:block;width:100%;border:1px solid #d6e1d8;border-radius:12px;padding:13px}.item.active{border-color:#31784e;background:#eff7f0}.item strong{display:block}.item small{display:block;color:#718373;margin-top:5px}.muted{color:#718373;font-size:13px;line-height:1.5}.tag{font-size:11px;background:#e9f3e9;padding:4px 9px;border-radius:15px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail div{background:#f7faf7;padding:10px 13px;border-radius:10px;min-width:0;overflow-wrap:anywhere}.detail strong{display:block;font-size:11px;color:#6c806f;margin-bottom:6px}.wide{grid-column:1/-1}.photos{display:flex;gap:8px;flex-wrap:wrap}.photos a{border:1px solid #d6dfd9;border-radius:9px;padding:8px;text-decoration:none;font-size:12px}.entry{display:grid;gap:6px;margin:15px 0}label{font-size:12px;font-weight:800}input,select,textarea{font:inherit;border:1px solid #cbdcd0;border-radius:10px;padding:11px;background:#fff;width:100%}textarea{min-height:92px}#feedback{font-size:13px;color:#8f4935;min-height:20px}@media(max-width:800px){.layout{grid-template-columns:1fr}body{padding:12px}.list{max-height:290px}.panel{padding:15px}}</style>
</head><body><main><header><div><div class="eyebrow">SADDLEBACK DESIGN CO. · PRIVATE WORKSPACE</div><h1>Door Quote Requests</h1><div class="muted">New customer inquiries, dimensions and private references.</div></div><div class="links"><a class="button" href="/saddleback/doors" target="_blank" rel="noopener">Open Door Quote Page</a><button id="copy" type="button">Copy customer link</button><button id="reload" type="button">Refresh</button></div></header><div class="layout"><section class="panel"><h2>Incoming requests <span id="count" class="tag">0</span></h2><div class="list" id="list" role="list"><div class="muted">Loading…</div></div></section><section class="panel" id="right"><h2 id="heading">Select a request</h2><div id="details" class="muted">Open a request to review its specifications and reference photos.</div><div id="editor" hidden><div class="entry"><label for="status">Status</label><select id="status"><option>New</option><option>Reviewing</option><option>Quoted</option><option>Closed</option></select></div><div class="entry"><label for="notes">Internal notes</label><textarea id="notes" maxlength="2500" placeholder="Staff-only notes; never visible to the customer"></textarea></div><button class="primary" id="save" type="button">Save review</button><p id="feedback" role="status"></p></div></section></div></main>
<script>
(()=>{'use strict';const $=x=>document.getElementById(x);let records=[],selected=null;const make=(tag,value,cls)=>{const e=document.createElement(tag);e.textContent=String(value??'');if(cls)e.className=cls;return e};async function api(path,options){const response=await fetch(path,{credentials:'same-origin',...options});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.detail||'Request failed');return data}function display(){const list=$('list');list.replaceChildren();$('count').textContent=records.length;if(!records.length){list.append(make('div','No requests yet.','muted'));return}for(const r of records){const b=make('button','');b.type='button';b.className='item'+(selected===r.id?' active':'');b.append(make('strong',r.full_name||'Unnamed request'));b.append(make('small',`${r.door_style||''} · ${r.door_count||1} door(s) · ${r.status||'New'}`));b.append(make('small',r.created_at?new Date(r.created_at).toLocaleString():''));b.onclick=()=>select(r.id);list.append(b)}}function detailRow(host,label,value,wide=false){const wrap=document.createElement('div');if(wide)wrap.className='wide';wrap.append(make('strong',label),make('span',value));host.append(wrap)}function select(id){selected=id;const r=records.find(x=>x.id===id);if(!r){$('editor').hidden=true;return}display();$('heading').textContent=`${r.full_name} · ${r.status}`;const host=$('details');host.replaceChildren();host.className='detail';for(const [k,v] of [['Email',r.email],['Phone',r.phone],['Style',r.door_style],['Quantity',r.door_count],['Opening',`${r.opening_width} × ${r.opening_height} ${r.measurement_unit}`],['Material',r.material],['Finish',r.wood_finish],['Delivery',`${r.fulfillment||''} ${r.postal_code||''}`],['Timeline',r.timeline],['Submitted',r.created_at?new Date(r.created_at).toLocaleString():''],['Project details',r.notes],['Campaign',r.utm_campaign]])detailRow(host,k,v||'—',k==='Project details');const photos=document.createElement('div');photos.className='wide';photos.append(make('strong','Reference photos'));const group=document.createElement('div');group.className='photos';for(let i=0;i<(r.photos||[]).length;i++){const a=make('a',`Photo ${i+1} · Open`);a.href=`/api/saddleback/door-quotes/${encodeURIComponent(r.id)}/photos/${i}`;a.target='_blank';a.rel='noopener';group.append(a)}if(!r.photos?.length)group.append(make('span','No photos attached','muted'));photos.append(group);host.append(photos);$('editor').hidden=false;$('status').value=r.status||'New';$('notes').value=r.staff_notes||'';$('feedback').textContent=''}async function load(){try{const d=await api('/api/saddleback/door-quotes');records=d.items||[];display();if(selected&&records.some(x=>x.id===selected))select(selected);else if(records.length)select(records[0].id);else{$('editor').hidden=true;$('details').replaceChildren(make('p','No quote requests have been submitted yet.','muted'));$('details').className='muted'}}catch(e){$('list').replaceChildren(make('div',e.message,'muted'))}}$('save').onclick=async()=>{if(!selected)return;const b=$('save');b.disabled=true;try{await api('/api/saddleback/door-quotes/'+encodeURIComponent(selected),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:$('status').value,staff_notes:$('notes').value})});await load();$('feedback').textContent='Review saved';}catch(e){$('feedback').textContent=e.message}finally{b.disabled=false}};$('reload').onclick=load;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(new URL('/saddleback/doors',location.origin).href);$('copy').textContent='Copied';setTimeout(()=>$('copy').textContent='Copy customer link',1600)}catch(e){$('copy').textContent='Copy failed'}};load()})();
</script></body></html>

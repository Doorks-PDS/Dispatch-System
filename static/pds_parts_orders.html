<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDS Parts Store · Sales & Orders</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#243446;background:#f7f9fb}*{box-sizing:border-box}body{margin:0;padding:22px}.container{max-width:1150px;margin:auto}header{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.eyebrow{color:#4b7899;text-transform:uppercase;letter-spacing:.13em;font-size:11px;font-weight:800}h1{font-size:28px;letter-spacing:-.04em;margin:5px 0}p{line-height:1.55;color:#627487}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:17px 0}a,button{background:white;color:#1c5378;padding:10px 14px;border:1px solid #cbd7e3;border-radius:10px;text-decoration:none;font-weight:750;font-size:13px;cursor:pointer}button.primary{background:#1d587f;color:white;border-color:#1d587f}.statrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:18px 0}.stat{padding:16px;border:1px solid #dce5ec;background:#fff;border-radius:14px}.stat strong{font-size:24px;display:block}.stat small{color:#698198}.filters{display:flex;gap:10px;justify-content:space-between;align-items:center;margin:18px 0}.filters select{padding:10px;background:#fff;border:1px solid #d4dfe8;border-radius:9px}.order{background:#fff;border:1px solid #dce5eb;border-radius:14px;padding:18px;margin-bottom:11px}.orderhead{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;align-items:center}.pill{background:#e9f2f8;color:#28618c;padding:6px 10px;border-radius:100px;text-transform:uppercase;font-weight:850;font-size:10px}.order h3{margin:0}.meta{color:#728395;font-size:12px;margin-top:6px}.items{margin:13px 0;border-top:1px solid #e9eef3;padding-top:12px}.items div{padding:3px 0}.address{white-space:pre-line;background:#f6f8fa;border-radius:9px;padding:10px;font-size:13px;color:#50657a}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:13px}.controls select,.controls input{padding:10px;border:1px solid #cfd9e3;border-radius:8px;font-size:13px;max-width:100%}.notice{background:#eef5f9;border:1px solid #d4e6f1;border-radius:12px;padding:13px;margin-top:12px;color:#466a81;font-size:13px}.error{color:#ae3131}.empty{padding:27px;border:1px dashed #cbd9e5;background:#fff;border-radius:13px}.row{display:flex;gap:12px;flex-wrap:wrap}@media(max-width:700px){body{padding:12px}.statrow{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><div class="container"><header><div><div class="eyebrow">PRIORITY DOOR SYSTEMS</div><h1>Parts Store · Sales & Orders</h1></div><div class="toolbar"><a href="/pds-parts" target="_blank" rel="noopener">Open public store</a><button id="refresh">Refresh</button></div></header><div class="statrow"><div class="stat"><strong id="statAll">0</strong><small>All orders</small></div><div class="stat"><strong id="statPaid">0</strong><small>Paid orders</small></div><div class="stat"><strong id="statFulfill">0</strong><small>To ship</small></div><div class="stat"><strong id="statReview">0</strong><small>Needs attention</small></div></div><div class="filters"><strong>Orders</strong><select id="filter" aria-label="Order status filter"><option value="all">All statuses</option><option value="requested">Requested</option><option value="contacted">Contacted</option><option value="paid">Paid / New</option><option value="supplier_ordered">Supplier ordered</option><option value="shipped">Shipped</option><option value="completed">Completed</option><option value="checkout_pending">Checkout pending</option><option value="checkout_uncertain">Needs reconciliation</option><option value="needs_review">Needs attention</option></select></div><div id="result" aria-live="polite"><div class="empty">Loading orders…</div></div></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let items=[];const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format((n||0)/100),node=(tag,text,cls)=>{const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n};async function req(url,opts){const r=await fetch(url,{credentials:'same-origin',...opts});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.detail||'Request failed');return data}function draw(){const all=items;$('statAll').textContent=all.length;$('statPaid').textContent=all.filter(x=>x.paid_at).length;$('statFulfill').textContent=all.filter(x=>x.state==='paid'||x.state==='supplier_ordered').length;$('statReview').textContent=all.filter(x=>x.state==='needs_review'||x.state==='checkout_uncertain').length;const filter=$('filter').value,rows=all.filter(x=>filter==='all'||x.state===filter);const host=$('result');host.replaceChildren();if(!rows.length){host.append(node('div','No orders match this filter.','empty'));return}for(const order of rows){const box=node('section',null,'order'),head=node('div',null,'orderhead'),lhs=node('div');lhs.append(node('h3','Order '+order.id.slice(0,8)),node('div',new Date(order.created_at).toLocaleString()+' · '+money(order.subtotal_cents)+' parts + '+money(order.shipping_cents)+' shipping'+(order.test_mode?' · SANDBOX':'') ,'meta'));head.append(lhs,node('span',order.state.replaceAll('_',' '),'pill'));box.append(head);const lines=node('div',null,'items');for(const p of order.lines||[])lines.append(node('div',p.qty+' × '+[p.manufacturer,p.part_number,p.description].filter(Boolean).join(' · ')+' — '+money(p.price_cents*p.qty)));box.append(lines);if(order.customer_email){const mail=node('a',order.customer_email);mail.href='mailto:'+encodeURIComponent(order.customer_email);mail.style.padding='0';mail.style.border='0';box.append(mail)}if(order.shipping_address){const a=order.shipping_address;const address=[order.shipping_name,a.line1,a.line2,[a.city,a.state,a.postal_code].filter(Boolean).join(', '),a.country].filter(Boolean).join('\n');box.append(node('div',address,'address'))}const row=node('div',null,'controls');if(['requested','contacted','cancelled','paid','supplier_ordered','shipped','completed','needs_review'].includes(order.state)){const choose=node('select');const paid=!!order.paid_at;const states=paid?[['paid','Paid / New'],['supplier_ordered','Supplier ordered'],['shipped','Shipped'],['completed','Completed'],['needs_review','Needs review']]:[['requested','Requested'],['contacted','Contacted'],['needs_review','Needs review'],['cancelled','Cancelled']];for(const [value,label] of states){choose.add(new Option(label,value))}if(!states.some(([state])=>state===order.state))choose.add(new Option(order.state.replaceAll('_',' '),order.state));choose.value=order.state;const track=node('input');track.placeholder='Tracking number';track.value=order.tracking||'';track.maxLength=160;const carrier=node('input');carrier.placeholder='Carrier';carrier.value=order.carrier||'';carrier.maxLength=80;const eta=node('input');eta.type='date';eta.title='Estimated delivery date';eta.value=order.eta_date||'';const note=node('input');note.placeholder='Internal notes';note.value=order.staff_notes||'';note.maxLength=1600;const save=node('button','Save','primary');const message=node('span','');save.onclick=async()=>{save.disabled=true;try{await req('/pds-parts/api/orders/'+order.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:choose.value,tracking:track.value,carrier:carrier.value,eta_date:eta.value,staff_notes:note.value})});await load()}catch(e){message.textContent=e.message;message.className='error'}finally{save.disabled=false}};row.append(choose,track,carrier,eta,note,save,message)}else row.append(node('span','Payment pending — no fulfillment.','meta'));box.append(row);host.append(box)}}async function load(){try{const data=await req('/pds-parts/api/orders');items=data.items||[];draw()}catch(e){$('result').replaceChildren(node('div',e.message,'empty error'))}}$('filter').onchange=draw;$('refresh').onclick=load;load()})();
</script></body></html>

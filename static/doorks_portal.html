<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Doorks Customer & Vendor Portal</title><style>
:root{font:15px system-ui,-apple-system,sans-serif;color:#172133;background:#f6f7f8}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}header{background:linear-gradient(110deg,#647d53,#37553c);color:white;padding:20px 30px;display:flex;justify-content:space-between;align-items:center}header strong{font-size:27px}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 76px)}aside{padding:22px;background:#f1f0ed;border-right:1px solid #d6dce4}main{padding:28px;max-width:1300px;width:100%;margin:0 auto}.card{background:#fff;border:1px solid #d8dee7;border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 4px 18px #00000007}.nav{display:block;width:100%;text-align:left;padding:14px;margin:8px 0;border:1px solid #d6dee5;border-radius:10px;background:#fff;font-weight:700}.nav.active{background:#e6eee4;border-color:#78976b}.muted{color:#667284}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.metric{border:1px solid #dae2e8;padding:17px;border-radius:12px}.metric b{display:block;font-size:26px}h1{margin:0 0 8px}h2{margin:0 0 14px}h3{margin:0 0 10px}.item{display:block;width:100%;padding:18px;margin:10px 0;border:1px solid #d7dfe7;background:#fff;border-radius:12px;text-align:left}.item:hover{border-color:#65865b;background:#f7faf6}.item strong{display:block;font-size:17px;margin-bottom:6px}.btn{background:#405e3c;color:white;border:0;border-radius:9px;padding:11px 16px;margin:5px 6px 5px 0;font-weight:650}.secondary{background:white;color:#243246;border:1px solid #cbd5df}.danger{color:#9b261d}label{display:block;margin:12px 0 5px;font-weight:650}input,textarea,select{width:100%;padding:12px;border:1px solid #cbd4dd;border-radius:9px;background:#fff}textarea{min-height:110px}.backdrop{position:fixed;inset:0;background:#14213180;display:flex;justify-content:flex-end;z-index:50}.drawer{background:#fff;width:min(720px,100vw);height:100%;overflow:auto;padding:26px;box-shadow:-12px 0 40px #0002}.drawerhead{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #e1e6eb;padding-bottom:12px;margin-bottom:15px}.drawerhead h2{margin:0}.hidden{display:none!important}#status{margin:10px 0;white-space:pre-wrap}.tag{display:inline-block;border-radius:20px;padding:5px 10px;background:#edf2e9;color:#365b36;font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}@media(max-width:760px){.layout{grid-template-columns:1fr}aside{display:flex;gap:6px;flex-wrap:wrap;padding:8px}.nav{width:auto;margin:4px;padding:9px}main{padding:12px}.drawer{padding:16px}header{padding:14px}}
</style></head><body><header><strong>Doorks</strong><span id="identity">Checking invitation…</span></header><div class="layout"><aside id="navigation" hidden><button class="nav active" data-page="dashboard">Dashboard</button><button class="nav" data-page="requests">My Requests</button><button class="nav" data-page="documents" id="docsNav">Estimates & Invoices</button><button class="nav" data-page="records" id="vendorNav" hidden>Assignments & POs</button><button class="nav" data-page="new">+ New Inquiry / Update</button></aside><main><div id="status" role="status"></div><div id="view"></div></main></div><script>
'use strict';const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);const $=id=>document.getElementById(id);let account=null,documents=[],records={assignments:[],purchase_orders:[]},submissions=[];const api=async(path,data)=>{const r=await fetch('/doorks-portals/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'Request failed');return d};const E=(tag,txt,cls)=>{const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e};const money=n=>'$'+Number(n||0).toFixed(2);function notice(s){$('status').textContent=s||''}function card(title,body){const c=E('section',undefined,'card');c.append(E('h2',title));if(body)c.append(body);return c}function action(label,fn,secondary=false){const b=E('button',label,'btn'+(secondary?' secondary':''));b.type='button';b.onclick=fn;return b}function line(parent,label,value){const p=E('p');p.append(E('strong',label+': '),document.createTextNode(String(value??'—')));parent.append(p)}function drawer(title,build){const back=E('div',undefined,'backdrop'),pane=E('section',undefined,'drawer'),head=E('div',undefined,'drawerhead'),body=E('div');let dirty=false;const close=()=>{if(dirty&&!confirm('Discard unsaved changes?'))return;back.remove()};head.append(E('h2',title),action('✕ Close',close,true));pane.append(head,body);back.append(pane);back.ondblclick=e=>{if(e.target===back)close()};pane.addEventListener('input',()=>dirty=true);document.body.append(back);build(body,()=>{dirty=false;back.remove()});return pane}function field(parent,label,type='text',value=''){const l=E('label',label),i=E(type==='textarea'?'textarea':'input');if(type!=='textarea')i.type=type;i.value=value;i.setAttribute('aria-label',label);parent.append(l,i);return i}function switchPage(page){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const v=$('view');v.replaceChildren();if(page==='dashboard')dashboard(v);if(page==='requests')requestList(v);if(page==='documents')documentList(v);if(page==='records')vendorList(v);if(page==='new')newRequest();}
function dashboard(v){v.append(E('h1','Welcome to your '+(account.kind==='customer'?'Customer':'Vendor')+' Portal'));v.append(E('p','Requests and document updates are sent to the Doorks office for review. Nothing changes a work order, estimate, invoice, or purchase order automatically.','muted'));const metrics=E('div',undefined,'grid');for(const [name,n] of [['My submissions',submissions.length],[account.kind==='customer'?'Estimates & invoices':'Assignments & POs',account.kind==='customer'?documents.length:records.assignments.length+records.purchase_orders.length]]){const m=E('div',undefined,'metric');m.append(E('b',n),E('span',name));metrics.append(m)}v.append(card('Overview',metrics));v.append(card('Quick actions',(()=>{const d=E('div');d.append(action(account.kind==='customer'?'+ Submit an inquiry':'+ Send an update',newRequest),action('View my requests',()=>switchPage('requests'),true),action(account.kind==='customer'?'View documents':'View assignments & POs',()=>switchPage(account.kind==='customer'?'documents':'records'),true));return d})()));}
function requestList(v){v.append(E('h1','My Requests & Updates'));v.append(E('p','Your submitted messages and document updates appear here.','muted'));v.append(action('+ New request',newRequest));if(!submissions.length)v.append(card('No requests yet',E('p','Use New Inquiry / Update to contact the office.')));for(const s of submissions.slice().reverse()){const b=E('button',undefined,'item');b.append(E('strong',s.subject||'Request'),E('span',s.status||'Pending review','tag'),E('p',s.reference||s.created_at||'','muted'));b.onclick=()=>drawer(s.subject||'Request',body=>{line(body,'Status',s.status);line(body,'Reference',s.reference);line(body,'Message',s.message);line(body,'Submitted',s.created_at)});v.append(b)}}
function documentList(v){v.append(E('h1','My Estimates & Invoices'));v.append(E('p','Only documents explicitly linked to your saved customer account and released from draft are visible.','muted'));if(!documents.length)v.append(card('No published documents',E('p','Ask the office to link the correct customer record to your invitation and documents.')));for(const d of documents){const b=E('button',undefined,'item');b.append(E('strong',(d.document_type||'Document')+' '+(d.document_number||'')),E('span',d.status||'','tag'),E('p','Total '+money(d.amount)+(d.document_type==='Invoice'?' · Balance '+money(d.balance_due):''),'muted'));b.onclick=()=>drawer(d.document_type+' '+d.document_number,(body,close)=>{line(body,'Status',d.status);line(body,'Date',d.date);line(body,'Total',money(d.amount));if(d.document_type==='Invoice')line(body,'Balance',money(d.balance_due));if(d.notes)line(body,'Notes',d.notes);if(d.line_items?.length){body.append(E('h3','Line items'));for(const item of d.line_items)line(body,item.description||item.item||'Item','Qty '+(item.quantity||1))}if(d.checkout_url){const a=E('a','Pay with external payment provider');a.href=d.checkout_url;a.target='_blank';a.rel='noopener noreferrer';body.append(a)}if(d.document_type==='Estimate'&&['sent','quote sent','pending approval'].includes(String(d.status).toLowerCase())){const note=field(body,'Note to office','textarea');for(const [label,decision] of [['Request approval','approve'],['Decline','decline'],['Ask a question','question']])body.append(action(label,async()=>{try{await api('customer/document-response',{token,document_id:d.id,decision,note:note.value});notice('Response submitted for office review.');close();await loadRequests()}catch(e){alert(e.message)}}))}if(d.document_type==='Invoice'&&Number(d.balance_due)>0){const note=field(body,'Payment question','textarea');body.append(action('Send payment question',async()=>{try{await api('customer/payment-question',{token,document_id:d.id,note:note.value,request_id:crypto.randomUUID()});notice('Payment question sent to office.');close();await loadRequests()}catch(e){alert(e.message)}}))}});v.append(b)}}
function vendorList(v){v.append(E('h1','Assignments & Purchase Orders'));v.append(E('p','Open a ticket to review details, submit a status update or upload supporting documents.','muted'));for(const [type,list] of [['assignment',records.assignments],['purchase_order',records.purchase_orders]]){v.append(E('h2',type==='assignment'?'Assignments':'Purchase Orders'));if(!list.length)v.append(E('p','No available records.','muted'));for(const r of list){const b=E('button',undefined,'item');b.append(E('strong',(r.po_number||r.work_order_number||'Record')+' · '+(r.status||'Open')),E('p',r.scope||r.description||'','muted'));b.onclick=()=>drawer((r.po_number||r.work_order_number||'Record'),(body,close)=>{for(const [k,value] of Object.entries(r))if(value&&k!=='id')line(body,k.replaceAll('_',' '),value);const sel=E('select');for(const status of(type==='assignment'?['accepted','declined','in_progress','completed','delayed','question']:['shipped','received','delayed','question'])){const o=E('option',status.replaceAll('_',' '));o.value=status;sel.append(o)}body.append(E('h3','Submit status update'),sel);const note=field(body,'Notes','textarea');body.append(action('Send update for office review',async()=>{try{await api('vendor/update',{token,record_type:type,record_id:r.id,update_status:sel.value,note:note.value,request_id:crypto.randomUUID()});notice('Update submitted for review.');close();await loadRequests()}catch(e){alert(e.message)}}));body.append(E('h3','Upload documents or photos'));const file=field(body,'PDF / JPG / PNG / WEBP','file');file.accept='.pdf,.png,.jpg,.jpeg,.webp';body.append(action('Upload to office',async()=>{if(!file.files.length)return alert('Choose a file');const fd=new FormData();fd.append('token',token);fd.append('record_type',type);fd.append('record_id',r.id);fd.append('note',note.value);fd.append('file',file.files[0]);try{const resp=await fetch('/doorks-portals/vendor/upload',{method:'POST',body:fd});const out=await resp.json();if(!resp.ok)throw Error(out.detail||'Upload failed');notice('File uploaded for office review.');close();await loadRequests()}catch(e){alert(e.message)}}))});v.append(b)}}}
function newRequest(){drawer(account.kind==='customer'?'New Customer Inquiry':'New Vendor Message',(body,close)=>{body.append(E('p','Send a message to the Doorks office. Your submission is not an automatic work order.','muted'));const subject=field(body,'Subject');const reference=field(body,'Work order / PO reference (optional)');const message=field(body,'Details','textarea');body.append(action('Submit for office review',async()=>{if(!subject.value.trim()||!message.value.trim())return alert('Subject and details are required');try{await api('submit',{token,subject:subject.value,reference:reference.value,message:message.value});notice('Your request was submitted for office review.');close();await loadRequests();switchPage('requests')}catch(e){alert(e.message)}}))})}
async function loadRequests(){try{const d=await api('my-submissions',{token});submissions=d.submissions||[]}catch(e){notice('Request history unavailable: '+e.message)}}
async function boot(){try{if(!token)throw Error('Missing invitation token');account=await api('session',{token});$('identity').textContent=account.company+' · '+account.contact_name;$('navigation').hidden=false;$('docsNav').hidden=account.kind!=='customer';$('vendorNav').hidden=account.kind!=='vendor';if(account.kind==='customer'){const d=await api('customer/documents',{token});documents=d.documents||[]}else{records=await api('vendor/records',{token})}await loadRequests();document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>switchPage(b.dataset.page));notice('');switchPage('dashboard')}catch(e){notice('Portal access unavailable: '+e.message)}}boot();
</script></body></html>

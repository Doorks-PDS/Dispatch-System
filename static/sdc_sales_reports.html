<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SDC Sales & Reports</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#24372b;background:#f5f7f5}*{box-sizing:border-box}body{margin:0;padding:18px}main{max-width:1420px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:16px}.eyebrow{letter-spacing:.16em;text-transform:uppercase;color:#548066;font-size:10px;font-weight:900}h1{font-size:clamp(24px,3vw,32px);letter-spacing:-.04em;margin:3px 0 4px}p{margin:0;color:#6b8274;font-size:13px;line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap}.button,button{font:inherit;font-size:13px;cursor:pointer;text-decoration:none;font-weight:700;border:1px solid #cadae0;border-radius:10px;background:#fff;color:#2c5940;padding:10px 13px}.button:hover,button:hover{background:#eef6ef}button:focus-visible,a:focus-visible{outline:3px solid #8bc39e;outline-offset:2px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin:0 0 15px}.metric{border:1px solid #dce8df;border-radius:14px;padding:15px;background:#fff}.metric strong{font-size:26px;display:block;line-height:1.25}.metric span{color:#647969;font-size:12px}.panel{background:white;border:1px solid #dce7df;border-radius:17px;padding:15px}.tabs{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 14px}.tab{padding:11px 15px}.tab[aria-selected="true"]{border-color:#38704e;background:#e7f1e9;color:#1c5534}.tab-content{border:1px solid #e4e9e4;border-radius:13px;overflow:hidden;background:#fff}.tab-content iframe{display:block;width:100%;min-height:750px;height:990px;border:0}.helper{font-size:12px;color:#667b6b;margin:0 0 12px}.exports{margin-left:auto;display:flex;gap:9px;align-items:center;flex-wrap:wrap}.message{color:#9b3432;font-size:12px;min-height:16px}.muted{color:#718578}
@media(max-width:740px){body{padding:9px}.metrics{grid-template-columns:1fr 1fr}.heading{padding:8px}.panel{padding:10px}.exports{margin-left:0;width:100%}.tabs{gap:6px}.tab{font-size:12px}.metric{padding:13px}}
</style></head><body><main>
<div class="heading"><div><div class="eyebrow">Saddleback Design Co.</div><h1>Sales & Reports</h1><p>Software inquiries and door quote requests, together in one place.</p></div><div class="actions"><button type="button" id="refresh">Refresh counts</button></div></div>
<div class="metrics"><div class="metric"><strong id="softwareNew">—</strong><span>New software inquiries</span></div><div class="metric"><strong id="softwareTotal">—</strong><span>All software inquiries</span></div><div class="metric"><strong id="doorsNew">—</strong><span>New door requests</span></div><div class="metric"><strong id="doorsTotal">—</strong><span>All door requests</span></div></div>
<section class="panel"><div class="tabs" role="tablist" aria-label="Sales lead queues"><button type="button" class="tab" id="softwareTab" role="tab" aria-controls="salesFrame" aria-selected="true">Atlas Software Leads</button><button type="button" class="tab" id="doorsTab" role="tab" aria-controls="salesFrame" aria-selected="false">Door Quote Requests</button><div class="exports"><a id="export" class="button" href="/api/software/inquiries/export.csv">Export software CSV</a></div></div><p class="helper" id="description">Review Atlas Software inquiries, contact details, and sales follow-ups.</p><p class="message" id="error" role="status"></p><div class="tab-content"><iframe id="salesFrame" title="Atlas Software Leads" src="/sdc/software-leads"></iframe></div></section>
</main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),frame=$('salesFrame');
const choices={software:{label:'Atlas Software Leads',url:'/sdc/software-leads',description:'Review software inquiries, contact details, and sales follow-ups.',export:'/api/software/inquiries/export.csv',exportTitle:'Export software CSV'},doors:{label:'Door Quote Requests',url:'/sdc/door-quote-requests',description:'Review custom-door requests, photos, notes, and quote follow-ups.',export:'/api/saddleback/door-quotes/export.csv',exportTitle:'Export door CSV'}};
let selected='software';function switchTab(value){if(value===selected)return;selected=value;const tab=choices[value];$('softwareTab').setAttribute('aria-selected',String(value==='software'));$('doorsTab').setAttribute('aria-selected',String(value==='doors'));$('description').textContent=tab.description;$('export').href=tab.export;$('export').textContent=tab.exportTitle;frame.title=tab.label;frame.src=tab.url;frame.style.height='990px'}
$('softwareTab').onclick=()=>switchTab('software');$('doorsTab').onclick=()=>switchTab('doors');
function resize(){try{const doc=frame.contentDocument;if(!doc)return;const h=Math.max(doc.body?.scrollHeight||0,doc.documentElement?.scrollHeight||0);if(h)frame.style.height=Math.min(Math.max(h+20,750),14000)+'px'}catch(err){}}
frame.addEventListener('load',()=>{resize();try{if(typeof ResizeObserver!=='undefined'){new ResizeObserver(resize).observe(frame.contentDocument.body)}}catch(err){}});
async function refresh(){try{const [a,b]=await Promise.all([fetch('/api/software/inquiries',{credentials:'same-origin'}),fetch('/api/saddleback/door-quotes',{credentials:'same-origin'})]);if(!a.ok||!b.ok)throw Error('Unable to load SDC sales figures. Confirm you are signed in to the SDC workspace.');const software=(await a.json()).items||[],doors=(await b.json()).items||[];$('softwareTotal').textContent=software.length;$('softwareNew').textContent=software.filter(x=>String(x.status||'New').toLowerCase()==='new').length;$('doorsTotal').textContent=doors.length;$('doorsNew').textContent=doors.filter(x=>String(x.status||'New').toLowerCase()==='new').length;$('error').textContent=''}catch(err){$('error').textContent=err.message}}
$('refresh').onclick=refresh;refresh();
})();
</script></body></html>

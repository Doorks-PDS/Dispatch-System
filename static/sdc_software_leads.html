<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SDC Software Inquiries</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#18241b;background:#f6f8f5}body{max-width:1100px;margin:30px auto;padding:0 20px}header{display:flex;justify-content:space-between;align-items:center;gap:15px}h1{font-size:26px}a{color:#335b3c}button,select,input,textarea{font:inherit;padding:9px;border:1px solid #b6c6b9;border-radius:9px;background:white}button{cursor:pointer;background:#335b3c;color:white}section{display:grid;gap:15px}.filters{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.filters input{min-width:220px;flex:1}.empty{padding:20px;background:white;border:1px solid #dce4de;border-radius:12px}.lead{background:white;border:1px solid #dce4de;border-radius:14px;padding:18px;overflow-wrap:anywhere}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.meta{color:#536557;font-size:13px}.note{white-space:pre-wrap}.followup{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:flex-end}.followup label{display:flex;flex-direction:column;align-items:stretch;gap:5px;flex:1;min-width:160px}.followup textarea{min-height:66px;resize:vertical}.due{border-left:5px solid #a85628}.pipeline-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.pipeline-actions button{background:#f0f4f0;color:#294c33}.onboarding{margin-top:16px;padding:14px;border-radius:12px;background:#f3f7f3}.onboarding label{display:flex;align-items:center;gap:8px;margin:8px 0}.onboarding input{width:auto}.onboarding h3{margin:0 0 8px}.history{font-size:12px;color:#65766b;margin-top:9px}label{display:flex;gap:8px;align-items:center}#message{min-height:20px} </style><link rel="stylesheet" href="/static/doorks_visual_polish.css?v=122"></head><body><header><h1>SDC Software Inquiries</h1><nav><a href="/">Back to Doorks</a> · <a href="/software" target="_blank" rel="noopener">Public storefront</a></nav></header><p>Office-admin view of software leads submitted through the public storefront.</p><p id="message" role="status" aria-live="polite">Loading inquiries…</p><div class="filters"><input id="search" type="search" placeholder="Search business, contact, email or package" aria-label="Search inquiries"><select id="statusFilter" aria-label="Filter by status"><option value="">All statuses</option></select><select id="sort" aria-label="Sort inquiries"><option value="newest">Newest first</option><option value="followup">Follow-up date first</option></select><button id="refresh" type="button">Refresh</button><a href="/api/software/inquiries/export.csv" id="export" download>Export CSV</a></div><p id="pipeline" class="meta" aria-live="polite"></p><section id="leads"></section><script>
const statuses=['New','Contacted','Demo Scheduled','Demo Completed','Proposal Sent','Won','Lost'];const list=document.getElementById('leads'),msg=document.getElementById('message');let allLeads=[];const search=document.getElementById('search'),filter=document.getElementById('statusFilter');for(const status of statuses){const opt=document.createElement('option');opt.value=status;opt.textContent=status;filter.append(opt)}search.addEventListener('input',render);filter.addEventListener('change',render);document.getElementById('sort').addEventListener('change',render);document.getElementById('refresh').addEventListener('click',load);
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
async function load(){try{const response=await fetch('/api/software/inquiries',{credentials:'same-origin'});if(!response.ok)throw Error(response.status===401||response.status===403?'Sign in as an office admin and switch to SDC workspace.':'Unable to load inquiries ('+response.status+')');const body=await response.json();allLeads=Array.isArray(body.items)?body.items:[];render();loadSummary()}catch(err){msg.textContent=err.message}}
async function loadSummary(){try{const r=await fetch('/api/software/inquiries/summary',{credentials:'same-origin'});if(!r.ok)return;const s=await r.json();document.getElementById('pipeline').textContent='Pipeline: '+s.total+' inquiries · '+s.followups_due+' follow-ups due ('+s.followups_overdue+' overdue) · '+s.by_status.Won+' won · '+s.by_status['Proposal Sent']+' proposals sent · '+s.demos_scheduled+' demos scheduled';}catch(e){/* Summary is optional; leads remain usable. */}}
function render(){list.replaceChildren();const query=search.value.trim().toLowerCase();const items=allLeads.filter(lead=>(!filter.value||(lead.status||'New')===filter.value)&&(!query||[lead.company,lead.contact,lead.email,lead.phone,lead.package,lead.notes,lead.utm_source,lead.utm_campaign].some(value=>String(value||'').toLowerCase().includes(query))));if(document.getElementById('sort').value==='followup')items.sort((a,b)=>(a.follow_up_date||'9999-12-31').localeCompare(b.follow_up_date||'9999-12-31'));msg.textContent=items.length+' of '+allLeads.length+' inquiries';if(!items.length){list.append(el('p','empty',allLeads.length?'No inquiries match these filters.':'No software inquiries received yet.'));return}for(const lead of items){const card=el('article','lead');const today=new Date().toLocaleDateString('en-CA',{year:'numeric',month:'2-digit',day:'2-digit'});if(lead.follow_up_date&&lead.follow_up_date<today&&!['Won','Lost'].includes(lead.status))card.classList.add('due');const top=el('div','top');top.append(el('h2','',lead.company||'Unknown business'));const label=el('label','', 'Status ');const select=el('select');for(const status of statuses){const option=el('option','',status);option.value=status;select.append(option)}select.value=statuses.includes(lead.status)?lead.status:'New';select.addEventListener('change',async()=>{const desired=select.value;select.disabled=true;try{const res=await fetch('/api/software/inquiries/'+encodeURIComponent(lead.id),{method:'PATCH',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:desired})});if(!res.ok)throw Error('Could not update status ('+res.status+')');lead.status=desired;msg.textContent='Status saved'}catch(err){select.value=lead.status||'New';msg.textContent=err.message}finally{select.disabled=false}});label.append(select);top.append(label);card.append(top);card.append(el('p','meta',(lead.contact||'')+' · '+(lead.email||'')+' · '+(lead.phone||'') ));card.append(el('p','meta','Package: '+(lead.package||'')+' · Received: '+(lead.created_at||'')));if(lead.utm_source||lead.utm_campaign)card.append(el('p','meta','Marketing source: '+(lead.utm_source||'Direct')+(lead.utm_campaign?' · Campaign: '+lead.utm_campaign:'')));if(lead.demo_date)card.append(el('p','meta','Demo date: '+lead.demo_date));if(lead.notes)card.append(el('p','note',lead.notes));
const fields=el('div','followup');const noteLabel=el('label','','Internal sales notes');const internal=el('textarea');internal.maxLength=4000;internal.value=lead.internal_notes||'';internal.setAttribute('aria-label','Internal notes for '+(lead.company||'lead'));noteLabel.append(internal);fields.append(noteLabel);
const dateLabel=el('label','','Next follow-up');const date=el('input');date.type='date';date.value=lead.follow_up_date||'';dateLabel.append(date);fields.append(dateLabel);
const demoLabel=el('label','','Demo date');const demo=el('input');demo.type='date';demo.value=lead.demo_date||'';demoLabel.append(demo);fields.append(demoLabel);
const save=el('button','','Save sales details');save.type='button';save.addEventListener('click',async()=>{save.disabled=true;try{const response=await fetch('/api/software/inquiries/'+encodeURIComponent(lead.id),{method:'PATCH',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({internal_notes:internal.value,follow_up_date:date.value,demo_date:demo.value})});if(!response.ok)throw Error('Could not save follow-up ('+response.status+')');lead.internal_notes=internal.value;lead.follow_up_date=date.value;lead.demo_date=demo.value;msg.textContent='Follow-up saved for '+(lead.company||'lead')}catch(err){msg.textContent=err.message}finally{save.disabled=false}});fields.append(save);
const convert=el('button','','Create SDC customer');convert.type='button';convert.title='Create one linked SDC customer from this inquiry';convert.addEventListener('click',async()=>{if(!confirm('Create an SDC customer record from this software inquiry?'))return;convert.disabled=true;try{const response=await fetch('/api/software/inquiries/'+encodeURIComponent(lead.id)+'/convert-customer',{method:'POST',credentials:'same-origin'});const body=await response.json();if(!response.ok)throw Error(body.detail||'Customer conversion failed ('+response.status+')');convert.textContent='Customer linked';msg.textContent=body.already_exists?'Existing linked SDC customer found':'SDC customer created for '+(lead.company||'inquiry');}catch(err){msg.textContent=err.message;convert.disabled=false}});fields.append(convert);card.append(fields);
if(lead.status==='Won'){
 const steps=[['requirements_confirmed','Requirements confirmed'],['package_confirmed','Package and scope confirmed'],['agreement_signed','Agreement signed'],['payment_arranged','Billing/payment arranged'],['configuration_planned','Configuration planned'],['training_scheduled','Training scheduled'],['launch_verified','Customer launch verified']];
 const onboard=el('div','onboarding');onboard.append(el('h3','','Customer onboarding'));onboard.append(el('p','meta','Track setup milestones here. Checking a box does not create an account, charge a payment, or provision a deployment.'));
 const selected=new Set(Array.isArray(lead.onboarding_completed)?lead.onboarding_completed:[]);
 for(const [key,title] of steps){const label=el('label');const cb=el('input');cb.type='checkbox';cb.checked=selected.has(key);cb.addEventListener('change',()=>cb.checked?selected.add(key):selected.delete(key));label.append(cb,document.createTextNode(title));onboard.append(label)}
 const saveOnboard=el('button','','Save onboarding progress');saveOnboard.type='button';saveOnboard.addEventListener('click',async()=>{saveOnboard.disabled=true;try{const response=await fetch('/api/software/inquiries/'+encodeURIComponent(lead.id),{method:'PATCH',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({onboarding_completed:[...selected]})});if(!response.ok)throw Error('Could not save onboarding progress ('+response.status+')');lead.onboarding_completed=[...selected];msg.textContent='Onboarding progress saved for '+(lead.company||'lead')}catch(err){msg.textContent=err.message}finally{saveOnboard.disabled=false}});onboard.append(saveOnboard);card.append(onboard)
} 
if(Array.isArray(lead.status_history)&&lead.status_history.length){const last=lead.status_history[lead.status_history.length-1];card.append(el('p','history','Last status change: '+(last.from||'')+' → '+(last.to||'')+' · '+(last.at||'')))}list.append(card)}}load();</script></body></html>

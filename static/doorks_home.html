<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Doorks | Service & Customer Portal</title><style>*{box-sizing:border-box}body{font:16px system-ui;margin:0;background:#f3f6f2;color:#1d2935}header{background:linear-gradient(110deg,#5b7951,#304c37);padding:22px 6%;color:white;display:flex;justify-content:space-between}header b{font-size:28px}main{max-width:1080px;margin:45px auto;padding:0 20px}h1{font-size:clamp(30px,4vw,46px)}p{color:#64717a;line-height:1.5}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:30px 0}.tile{border:1px solid #d6dfd6;border-radius:20px;background:white;overflow:hidden;text-align:left;cursor:pointer;box-shadow:0 6px 24px #1232}.tile svg{width:100%;height:170px;background:#e5eee5;padding:40px;stroke:#36583e;fill:none;stroke-width:2}.tile strong{display:block;font-size:22px;margin:16px}.tile span{display:block;color:#667;margin:0 16px 22px}section{background:white;border:1px solid #d6dfd6;border-radius:18px;padding:24px;max-width:540px;margin:20px auto}label{display:block;font-weight:650;margin:12px 0}input{width:100%;padding:12px;border:1px solid #cbd5d0;border-radius:8px;font:inherit}button.submit{background:#365b3b;color:white;border:0;border-radius:9px;padding:13px 18px;font:inherit;font-weight:700;cursor:pointer}a{color:#365b3b}#app{max-width:920px;margin:0 auto}.item{border:1px solid #d6dfd6;padding:14px;border-radius:10px;margin:10px 0}small{color:#637080}@media(max-width:700px){.cards{grid-template-columns:1fr}.tile{display:grid;grid-template-columns:100px 1fr}.tile svg{height:100px;padding:18px;grid-row:span 2}.tile strong{margin:12px 12px 0}.tile span{margin:0 12px 12px}}</style></head><body><header><b>Doorks</b><span>Service & Customer Portal</span></header><main><div id="landing"><h1>How can we help?</h1><p>Request service, create a customer account, or sign in to view your work orders and invoices.</p><div class="cards"><button class="tile" onclick="location.href='/doorks-portals/request-service'"><svg viewBox="0 0 100 100"><path d="M20 15h42l18 18v52H20zM62 15v20h18M30 50h40M30 62h40M30 74h25"/></svg><strong>New Inquiry</strong><span>Tell us about a job or project</span></button><button class="tile" onclick="show('register')"><svg viewBox="0 0 100 100"><circle cx="42" cy="30" r="16"/><path d="M15 80V68q0-20 27-20t27 20v12M78 45v30M63 60h30"/></svg><strong>Create Account</strong><span>Register for ongoing portal access</span></button><button class="tile" onclick="show('login')"><svg viewBox="0 0 100 100"><rect x="20" y="44" width="60" height="44" rx="7"/><path d="M33 44V28a17 17 0 0134 0v16M50 60v15"/></svg><strong>Login</strong><span>Work orders, invoices and payments</span></button></div></div><div id="app" hidden></div></main><script>
const app=document.getElementById('app'),landing=document.getElementById('landing');function show(which){landing.hidden=true;app.hidden=false;app.replaceChildren();const h=document.createElement('h2');h.textContent=which==='register'?'Create your account':'Customer login';const section=document.createElement('section');section.append(h);const form=document.createElement('form');const keys=which==='register'?[['contact_name','Contact name','text'],['company','Company','text'],['email','Email','email'],['password','Password (12+ characters)','password']]:[['email','Email','email'],['password','Password','password']];for(const [key,label,type] of keys){const l=document.createElement('label');l.textContent=label;const i=document.createElement('input');i.name=key;i.type=type;i.required=true;if(key==='password'&&which==='register')i.minLength=12;l.append(i);form.append(l)}const b=document.createElement('button');b.className='submit';b.textContent=which==='register'?'Submit registration':'Sign in';form.append(b);const status=document.createElement('p');form.append(status);form.onsubmit=async e=>{e.preventDefault();b.disabled=true;try{const payload=Object.fromEntries(new FormData(form));const r=await fetch('/doorks-portals/accounts/'+(which==='register'?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok)throw Error(data.detail||'Request failed');if(which==='register'){form.remove();status.textContent=data.message;section.append(status)}else await dashboard();}catch(err){status.textContent=err.message}finally{b.disabled=false}};section.append(form);app.append(section);const back=document.createElement('p');back.innerHTML='<a href="/doorks-portals/home">Back to options</a>';app.append(back)}
async function api(path,options){const r=await fetch('/doorks-portals/'+path,{cache:'no-store',...options});const d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d}
async function dashboard(){const me=await api('accounts/me');landing.hidden=true;app.hidden=false;app.replaceChildren();const title=document.createElement('h2');title.textContent='Welcome, '+me.name;app.append(title);const logout=document.createElement('button');logout.className='submit';logout.textContent='Sign out';logout.onclick=async()=>{await api('accounts/logout',{method:'POST'});location.href='/doorks-portals/home'};app.append(logout);const [docs,jobs]=await Promise.all([api('accounts/documents'),api('accounts/work-orders')]);const orders=document.createElement('section');orders.innerHTML='<h2>My Work Orders</h2>';for(const j of jobs.work_orders){const d=document.createElement('div');d.className='item';d.textContent=[j.job_number||j.work_order_number,j.status,j.address,j.scheduled_date].filter(Boolean).join(' · ');orders.append(d)}if(!jobs.work_orders.length)orders.append(document.createTextNode('No linked work orders.'));app.append(orders);const invoices=document.createElement('section');invoices.innerHTML='<h2>Estimates & Invoices</h2>';for(const doc of docs.documents){const d=document.createElement('div');d.className='item';const total=document.createElement('strong');total.textContent=[doc.document_type,doc.document_number,'$'+Number(doc.amount||0).toFixed(2),'Balance $'+Number(doc.balance_due||0).toFixed(2)].join(' · ');d.append(total);if(doc.document_type==='Invoice'&&doc.balance_due>0){const b=document.createElement('button');b.className='submit';b.style.marginLeft='12px';b.textContent='Pay securely';b.onclick=async()=>{b.disabled=true;try{const r=await api('accounts/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({document_id:doc.id})});location.href=r.url}catch(e){alert(e.message);b.disabled=false}};d.append(b)}invoices.append(d)}if(!docs.documents.length)invoices.append(document.createTextNode('No released documents linked to this customer account.'));app.append(invoices);const payments=await api('accounts/payments');const receipts=document.createElement('section');receipts.innerHTML='<h2>Payment History</h2>';for(const payment of payments.payments){const row=document.createElement('div');row.className='item';row.textContent='Invoice '+payment.invoice_id+' · $'+Number(payment.amount).toFixed(2)+' · '+payment.status+' · '+payment.paid_at;receipts.append(row)}if(!payments.payments.length)receipts.append(document.createTextNode('No Stripe payments recorded yet.'));app.append(receipts)}
api('accounts/me').then(()=>dashboard()).catch(()=>{});if(location.search.includes('payment=return'))alert('Checkout returned. Payment status will update after Stripe confirms it.');
</script></body></html>

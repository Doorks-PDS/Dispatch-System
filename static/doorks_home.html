<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Doorks | Service & Customer Portal</title><style>*{box-sizing:border-box}body{font:16px system-ui;margin:0;background:#f3f6f2;color:#1d2935}header{background:linear-gradient(110deg,#5b7951,#304c37);padding:22px 6%;color:white;display:flex;justify-content:space-between}header b{font-size:28px}main{max-width:1080px;margin:45px auto;padding:0 20px}h1{font-size:clamp(30px,4vw,46px)}p{color:#64717a;line-height:1.5}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:30px 0}.tile{border:1px solid #d6dfd6;border-radius:20px;background:white;overflow:hidden;text-align:left;cursor:pointer;box-shadow:0 6px 24px #1232}.tile svg{width:100%;height:170px;background:#e5eee5;padding:40px;stroke:#36583e;fill:none;stroke-width:2}.tile strong{display:block;font-size:22px;margin:16px}.tile span{display:block;color:#667;margin:0 16px 22px}section{background:white;border:1px solid #d6dfd6;border-radius:18px;padding:24px;max-width:540px;margin:20px auto}label{display:block;font-weight:650;margin:12px 0}input{width:100%;padding:12px;border:1px solid #cbd5d0;border-radius:8px;font:inherit}button.submit{background:#365b3b;color:white;border:0;border-radius:9px;padding:13px 18px;font:inherit;font-weight:700;cursor:pointer}a{color:#365b3b}#app{max-width:920px;margin:0 auto}.item{border:1px solid #d6dfd6;padding:14px;border-radius:10px;margin:10px 0}small{color:#637080}@media(max-width:700px){.cards{grid-template-columns:1fr}.tile{display:grid;grid-template-columns:100px 1fr}.tile svg{height:100px;padding:18px;grid-row:span 2}.tile strong{margin:12px 12px 0}.tile span{margin:0 12px 12px}}#app{max-width:1320px}.portal-shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;align-items:start}.portal-sidebar{background:#fff;border:1px solid #d6dfd6;border-radius:16px;padding:16px;display:grid;gap:8px;position:sticky;top:20px}.portal-sidebar h2{font-size:20px;margin:8px}.portal-nav{background:white;color:#24362a;border:1px solid #d5dfd5;border-radius:10px;padding:12px;text-align:left;font:inherit;font-weight:650;cursor:pointer}.portal-nav.selected{background:#e2ede1;border-color:#65846b}.portal-content{min-width:0}.portal-content h2{margin:22px 0 12px}.portal-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.portal-stat,.portal-card{background:#fff;border:1px solid #d7e1d7;border-radius:12px;padding:16px}.portal-stat{display:grid;gap:6px}.portal-stat b{font-size:28px}.portal-card{display:block;width:100%;text-align:left;margin:9px 0;font:inherit;color:#1d2935}.portal-card:disabled{opacity:1}.portal-card p{margin:6px 0 0}.calendar-head{display:flex;justify-content:center;gap:18px;align-items:center;margin:12px}.calendar-head button{padding:8px 15px}.portal-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.portal-calendar>b{text-align:center}.calendar-day{background:white;border:1px solid #d6dfd6;border-radius:8px;min-height:86px;padding:7px;overflow-wrap:anywhere}.calendar-day small{display:block;margin-top:6px;background:#e3eee5;border-radius:5px;padding:4px}.vendor-upload{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}.vendor-upload input{max-width:240px}@media(max-width:750px){.portal-shell{grid-template-columns:1fr}.portal-sidebar{position:static}.portal-calendar{font-size:11px}.calendar-day{min-height:60px;padding:3px}} </style></head><body><header><button id="portalHome" type="button" title="Return to dashboard and calendar" aria-label="Dashboard and calendar" style="background:transparent;border:0;color:white;font-size:28px;cursor:pointer">📅</button><b style="position:absolute;left:50%;transform:translateX(-50%)">Doorks</b><span>Service & Customer Portal</span></header><main><div id="landing"><h1>How can we help?</h1><p>Request service, create a customer or vendor account, or sign in to your secure service center.</p><div class="cards"><button class="tile" onclick="location.href='/doorks-portals/request-service'"><svg viewBox="0 0 100 100"><path d="M20 15h42l18 18v52H20zM62 15v20h18M30 50h40M30 62h40M30 74h25"/></svg><strong>New Inquiry</strong><span>Tell us about a job or project</span></button><button class="tile" onclick="show('register')"><svg viewBox="0 0 100 100"><circle cx="42" cy="30" r="16"/><path d="M15 80V68q0-20 27-20t27 20v12M78 45v30M63 60h30"/></svg><strong>Create Account</strong><span>Register as a customer or vendor</span></button><button class="tile" onclick="show('login')"><svg viewBox="0 0 100 100"><rect x="20" y="44" width="60" height="44" rx="7"/><path d="M33 44V28a17 17 0 0134 0v16M50 60v15"/></svg><strong>Login</strong><span>Customer and vendor service centers</span></button></div></div><div id="app" hidden></div></main><script>
const app=document.getElementById('app'),landing=document.getElementById('landing');function show(which){landing.hidden=true;app.hidden=false;app.replaceChildren();const h=document.createElement('h2');h.textContent=which==='register'?'Create your account':'Customer or vendor login';const section=document.createElement('section');section.append(h);const form=document.createElement('form');const keys=which==='register'?[['contact_name','Contact name','text'],['company','Company','text'],['email','Email','email'],['password','Password (12+ characters)','password']]:[['email','Email','email'],['password','Password','password']];for(const [key,label,type] of keys){const l=document.createElement('label');l.textContent=label;const i=document.createElement('input');i.name=key;i.type=type;i.required=true;if(key==='password'&&which==='register')i.minLength=12;l.append(i);form.append(l)}if(which==='register'){const l=document.createElement('label');l.textContent='Account type';const select=document.createElement('select');select.name='role';select.style.cssText='width:100%;padding:12px;border:1px solid #cbd5d0;border-radius:8px';select.add(new Option('Customer','customer'));select.add(new Option('Vendor / subcontractor','vendor'));l.append(select);form.prepend(l)}const b=document.createElement('button');b.className='submit';b.textContent=which==='register'?'Submit registration':'Sign in';form.append(b);const status=document.createElement('p');form.append(status);form.onsubmit=async e=>{e.preventDefault();b.disabled=true;try{const payload=Object.fromEntries(new FormData(form));const r=await fetch('/doorks-portals/accounts/'+(which==='register'?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok)throw Error(data.detail||'Request failed');if(which==='register'){form.remove();status.textContent=data.message;section.append(status)}else if(data.role==='vendor')await vendorDashboard();else await dashboard();}catch(err){status.textContent=err.message}finally{b.disabled=false}};section.append(form);app.append(section);const back=document.createElement('p');back.innerHTML='<a href="/doorks-portals/home">Back to options</a>';app.append(back)}
async function api(path,options){const r=await fetch('/doorks-portals/'+path,{cache:'no-store',...options});const d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d}
async function vendorDashboard(){const me=await api('vendor-account/me');const r=await api('vendor-account/records');landing.hidden=true;app.hidden=false;app.replaceChildren();const heading=document.createElement('h2');heading.textContent='Vendor Service Center · '+me.company;app.append(heading);const logout=document.createElement('button');logout.className='submit';logout.textContent='Sign out';logout.onclick=async()=>{await api('accounts/logout',{method:'POST'});location.href='/doorks-portals/home'};app.append(logout);const nav=document.createElement('nav');nav.style.cssText='display:flex;gap:10px;flex-wrap:wrap;margin:18px 0';app.append(nav);const main=document.createElement('div');app.append(main);const pages=[['Dashboard',()=>{main.replaceChildren();const info=document.createElement('section');info.innerHTML='<h2>Overview</h2>';info.append(document.createTextNode(r.assignments.length+' assignments · '+r.purchase_orders.length+' purchase orders'));main.append(info)}],['Assignments & Schedule',()=>{main.replaceChildren();const box=document.createElement('section');box.innerHTML='<h2>Assigned Work Orders</h2>';for(const a of r.assignments){const d=document.createElement('div');d.className='item';d.textContent=[a.work_order_number,a.status,a.scheduled_date,a.scheduled_time,a.address,a.scope,a.notes].filter(Boolean).join(' · ');box.append(d)}if(!r.assignments.length)box.append(document.createTextNode('No active assignments.'));main.append(box)}],['Purchase Orders',()=>{main.replaceChildren();const box=document.createElement('section');box.innerHTML='<h2>Purchase Orders</h2>';for(const po of r.purchase_orders){const d=document.createElement('div');d.className='item';d.textContent=[po.po_number,po.status,po.expected_date,po.description].filter(Boolean).join(' · ');box.append(d)}if(!r.purchase_orders.length)box.append(document.createTextNode('No purchase orders.'));main.append(box)}]];for(const [name,action] of pages){const b=document.createElement('button');b.className='submit';b.textContent=name;b.onclick=action;nav.append(b)}pages[0][1]();}
async function dashboard(){const me=await api('accounts/me');landing.hidden=true;app.hidden=false;app.replaceChildren();const title=document.createElement('h2');title.textContent='Welcome, '+me.name;app.append(title);const logout=document.createElement('button');logout.className='submit';logout.textContent='Sign out';logout.onclick=async()=>{await api('accounts/logout',{method:'POST'});location.href='/doorks-portals/home'};app.append(logout);const [docs,jobs]=await Promise.all([api('accounts/documents'),api('accounts/work-orders')]);const orders=document.createElement('section');orders.innerHTML='<h2>My Work Orders</h2>';for(const j of jobs.work_orders){const d=document.createElement('div');d.className='item';d.textContent=[j.job_number||j.work_order_number,j.status,j.address,j.scheduled_date].filter(Boolean).join(' · ');orders.append(d)}if(!jobs.work_orders.length)orders.append(document.createTextNode('No linked work orders.'));app.append(orders);const invoices=document.createElement('section');invoices.innerHTML='<h2>Estimates & Invoices</h2>';for(const doc of docs.documents){const d=document.createElement('div');d.className='item';const total=document.createElement('strong');total.textContent=[doc.document_type,doc.document_number,'$'+Number(doc.amount||0).toFixed(2),'Balance $'+Number(doc.balance_due||0).toFixed(2)].join(' · ');d.append(total);if(doc.document_type==='Invoice'&&doc.balance_due>0){const b=document.createElement('button');b.className='submit';b.style.marginLeft='12px';b.textContent='Pay securely';b.onclick=async()=>{b.disabled=true;try{const r=await api('accounts/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({document_id:doc.id})});location.href=r.url}catch(e){alert(e.message);b.disabled=false}};d.append(b)}invoices.append(d)}if(!docs.documents.length)invoices.append(document.createTextNode('No released documents linked to this customer account.'));app.append(invoices);const payments=await api('accounts/payments');const receipts=document.createElement('section');receipts.innerHTML='<h2>Payment History</h2>';for(const payment of payments.payments){const row=document.createElement('div');row.className='item';row.textContent='Invoice '+payment.invoice_id+' · $'+Number(payment.amount).toFixed(2)+' · '+payment.status+' · '+payment.paid_at;receipts.append(row)}if(!payments.payments.length)receipts.append(document.createTextNode('No Stripe payments recorded yet.'));app.append(receipts)}

function portalLayout(title,navItems){
  landing.hidden=true;app.hidden=false;app.replaceChildren();app.style.maxWidth='1320px';
  const shell=document.createElement('div');shell.className='portal-shell';
  const sidebar=document.createElement('aside');sidebar.className='portal-sidebar';
  const brand=document.createElement('h2');brand.textContent=title;sidebar.append(brand);
  const content=document.createElement('div');content.className='portal-content';shell.append(sidebar,content);app.append(shell);
  const buttons=new Map();
  for(const [id,label,handler] of navItems){const b=document.createElement('button');b.className='portal-nav';b.textContent=label;b.onclick=()=>{for(const x of buttons.values())x.classList.remove('selected');b.classList.add('selected');content.replaceChildren();handler(content)};sidebar.append(b);buttons.set(id,b)}
  const signout=document.createElement('button');signout.className='portal-nav';signout.textContent='Sign out';signout.onclick=async()=>{await api('accounts/logout',{method:'POST'});location.href='/doorks-portals/home'};sidebar.append(signout);
  return {content,open:id=>buttons.get(id)?.click()};
}
function portalCard(host,title,detail,click){const c=document.createElement('button');c.className='portal-card';const h=document.createElement('strong');h.textContent=title;const p=document.createElement('p');p.textContent=detail||'';c.append(h,p);if(click)c.onclick=click;else c.disabled=true;host.append(c);return c}
function portalDetails(title,fields){const backdrop=document.createElement('div');backdrop.style.cssText='position:fixed;inset:0;z-index:30000;background:#142b2480;display:flex;justify-content:flex-end';const panel=document.createElement('section');panel.style.cssText='background:#fff;width:min(620px,100vw);height:100%;overflow:auto;padding:24px;box-sizing:border-box';const heading=document.createElement('h2');heading.textContent=title;const close=document.createElement('button');close.className='submit';close.textContent='Close';close.onclick=()=>backdrop.remove();panel.append(heading,close);for(const [label,value] of fields){if(value===null||value===undefined||value==='')continue;const p=document.createElement('p');const strong=document.createElement('strong');strong.textContent=label+': ';p.append(strong,document.createTextNode(String(value)));panel.append(p)}backdrop.append(panel);backdrop.ondblclick=e=>{if(e.target===backdrop)backdrop.remove()};document.body.append(backdrop);return panel}
function portalJobDetails(job){portalDetails(job.job_number||job.work_order_number||'Work order',[['Status',job.status],['Customer',job.customer],['Address',job.address],['Service',job.service_type],['Scheduled date',job.scheduled_date],['Scheduled time',job.scheduled_time],['Description',job.description]])}
function portalDocumentDetails(doc){const panel=portalDetails((doc.document_type||'Document')+' '+(doc.document_number||''),[['Status',doc.status],['Total',Number(doc.amount||0).toLocaleString('en-US',{style:'currency',currency:'USD'})],['Balance',Number(doc.balance_due||0).toLocaleString('en-US',{style:'currency',currency:'USD'})],['Date',doc.date],['Notes',doc.notes]]);if(doc.document_type==='Invoice'&&Number(doc.balance_due)>0){const pay=document.createElement('button');pay.className='submit';pay.textContent='Pay securely with Stripe';pay.onclick=async()=>{pay.disabled=true;try{const r=await api('accounts/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({document_id:doc.id})});location.href=r.url}catch(err){alert(err.message);pay.disabled=false}};panel.append(pay)}}
function portalHeading(host,text){const h=document.createElement('h2');h.textContent=text;host.append(h)}
function portalCalendar(host,jobs){const today=new Date();let month=new Date(today.getFullYear(),today.getMonth(),1);const calendar=document.createElement('div');host.append(calendar);const render=()=>{calendar.replaceChildren();const head=document.createElement('div');head.className='calendar-head';const prev=document.createElement('button');prev.textContent='←';prev.onclick=()=>{month.setMonth(month.getMonth()-1);render()};const next=document.createElement('button');next.textContent='→';next.onclick=()=>{month.setMonth(month.getMonth()+1);render()};const label=document.createElement('strong');label.textContent=month.toLocaleString(undefined,{month:'long',year:'numeric'});head.append(prev,label,next);calendar.append(head);const grid=document.createElement('div');grid.className='portal-calendar';for(const day of ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']){const d=document.createElement('b');d.textContent=day;grid.append(d)}for(let i=0;i<new Date(month.getFullYear(),month.getMonth(),1).getDay();i++)grid.append(document.createElement('span'));for(let day=1;day<=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();day++){const cell=document.createElement('div');cell.className='calendar-day';const n=document.createElement('strong');n.textContent=day;cell.append(n);const key=[month.getFullYear(),String(month.getMonth()+1).padStart(2,'0'),String(day).padStart(2,'0')].join('-');for(const j of jobs.filter(j=>String(j.scheduled_date||'').slice(0,10)===key)){const t=document.createElement('small');t.textContent=(j.job_number||j.work_order_number||'Work order')+' · '+(j.status||'Scheduled');cell.append(t)}grid.append(cell)}calendar.append(grid)};render()}
async function dashboard(){const [me,docs,jobs,payments]=await Promise.all([api('accounts/me'),api('accounts/documents'),api('accounts/work-orders'),api('accounts/payments')]);const work=jobs.work_orders||[],documents=docs.documents||[],paid=payments.payments||[];
 const pages=[['home','🏠 Dashboard',v=>{portalHeading(v,'Welcome, '+me.name);const stats=document.createElement('div');stats.className='portal-stats';for(const [name,value] of [['Work orders',work.length],['Upcoming visits',work.filter(j=>j.scheduled_date&&j.scheduled_date>=new Date().toISOString().slice(0,10)).length],['Estimates & invoices',documents.length],['Payments',paid.length]]){const d=document.createElement('div');d.className='portal-stat';d.innerHTML='<b>'+value+'</b>';const p=document.createElement('span');p.textContent=name;d.append(p);stats.append(d)}v.append(stats);portalHeading(v,'My schedule');portalCalendar(v,work);portalHeading(v,'Recent work orders');for(const j of work.slice(-5).reverse())portalCard(v,j.job_number||j.work_order_number||'Work order',[j.status,j.address,j.scheduled_date].filter(Boolean).join(' · '),()=>portalJobDetails(j));}],['jobs','🛠 Work Orders',v=>{portalHeading(v,'My Work Orders');for(const j of work)portalCard(v,j.job_number||j.work_order_number||'Work order',[j.status,j.address,j.scheduled_date,j.scheduled_time,j.description].filter(Boolean).join(' · '),()=>portalJobDetails(j));if(!work.length)v.append('No linked work orders. Contact the office to verify your customer record.')}],['docs','📄 Estimates & Invoices',v=>{portalHeading(v,'Estimates & Invoices');for(const d of documents){const card=portalCard(v,(d.document_type||'Document')+' '+(d.document_number||''),[d.status,'Total $'+Number(d.amount||0).toFixed(2),'Balance $'+Number(d.balance_due||0).toFixed(2)].join(' · '),()=>portalDocumentDetails(d));if(d.document_type==='Invoice'&&Number(d.balance_due)>0){const b=document.createElement('button');b.className='submit';b.textContent='Pay securely with Stripe';b.onclick=async()=>{b.disabled=true;try{const r=await api('accounts/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({document_id:d.id})});location.href=r.url}catch(e){alert(e.message);b.disabled=false}};card.after(b)}}if(!documents.length)v.append('No released documents linked to this account.')}],['payments','💳 Payments',v=>{portalHeading(v,'Payment History');for(const p of paid)portalCard(v,'Invoice '+p.invoice_id,'$'+Number(p.amount||0).toFixed(2)+' · '+p.status+' · '+p.paid_at);if(!paid.length)v.append('No confirmed Stripe payments yet.')}]];
 const ui=portalLayout('Customer Service Center',pages);document.getElementById('portalHome').onclick=()=>ui.open('home');ui.open('home');}
async function vendorDashboard(){const [me,records]=await Promise.all([api('vendor-account/me'),api('vendor-account/records')]);const assignments=records.assignments||[],pos=records.purchase_orders||[];
 const showRecords=(v,rows,type)=>{portalHeading(v,type==='assignment'?'My Assignments':'Purchase Orders');for(const r of rows){const title=r.work_order_number||r.po_number||'Record';const c=portalCard(v,title,[r.status,r.address,r.scheduled_date,r.scheduled_time,r.scope||r.description].filter(Boolean).join(' · '));const upload=document.createElement('div');upload.className='vendor-upload';const file=document.createElement('input');file.type='file';file.accept='.pdf,.jpg,.jpeg,.png,.webp';const note=document.createElement('input');note.placeholder='Upload note (optional)';const send=document.createElement('button');send.className='submit';send.textContent='Upload photo / document';const result=document.createElement('small');send.onclick=async()=>{if(!file.files.length){result.textContent='Choose a file';return}send.disabled=true;const fd=new FormData();fd.append('record_type',type);fd.append('record_id',r.id);fd.append('note',note.value);fd.append('file',file.files[0]);try{const response=await fetch('/doorks-portals/vendor-account/upload',{method:'POST',body:fd,credentials:'same-origin'});const data=await response.json();if(!response.ok)throw Error(data.detail||'Upload failed');result.textContent='Uploaded for office review';file.value=''}catch(e){result.textContent=e.message}finally{send.disabled=false}};upload.append(file,note,send,result);c.after(upload)}if(!rows.length)v.append('No active records assigned to this vendor.')} ;
 const pages=[['home','🏠 Dashboard',v=>{portalHeading(v,'Welcome, '+me.company);const stats=document.createElement('div');stats.className='portal-stats';for(const [label,value] of [['Assignments',assignments.length],['Purchase orders',pos.length],['Scheduled',assignments.filter(x=>x.scheduled_date).length]]){const d=document.createElement('div');d.className='portal-stat';const b=document.createElement('b');b.textContent=value;const t=document.createElement('span');t.textContent=label;d.append(b,t);stats.append(d)}v.append(stats);portalHeading(v,'Assignment calendar');portalCalendar(v,assignments)}],['assignments','🛠 Assignments & Uploads',v=>showRecords(v,assignments,'assignment')],['calendar','📅 Schedule',v=>{portalHeading(v,'My Schedule');portalCalendar(v,assignments)}],['purchase','📦 Purchase Orders',v=>showRecords(v,pos,'purchase_order')]];
 const ui=portalLayout('Vendor Service Center',pages);document.getElementById('portalHome').onclick=()=>ui.open('home');ui.open('home');}

const moses=document.createElement('button');moses.textContent='✨ Moses';moses.type='button';moses.style.cssText='position:fixed;right:22px;bottom:22px;z-index:29000;background:#365b3b;color:white;border:0;border-radius:40px;padding:15px 22px;box-shadow:0 6px 24px #0003;font-weight:700';moses.onclick=()=>{const panel=portalDetails('Moses · Service Assistant',[['Service','Use Work Orders to review scheduled work, Estimates & Invoices to review charges, and Payments for confirmed receipts.'],['Help','For changes to a job, contact the Doorks office. Conversational AI is not yet enabled in the external portal.']]);};document.body.append(moses);

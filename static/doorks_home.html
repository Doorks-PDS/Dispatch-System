const app=document.getElementById('app'),landing=document.getElementById('landing');if(location.hash.startsWith('#reset='))setTimeout(()=>show('reset'),0);function show(which){landing.hidden=true;app.hidden=false;app.replaceChildren();const h=document.createElement('h2');h.textContent=which==='register'?'Create your account':which==='reset'?'Set a new password':'Customer or vendor login';const section=document.createElement('section');section.append(h);const form=document.createElement('form');const keys=which==='register'?[['contact_name','Contact name','text'],['company','Company','text'],['email','Email','email'],['password','Password (12+ characters)','password'],['password_confirm','Retype password','password']]:which==='reset'?[['password','New password (12+ characters)','password'],['password_confirm','Retype new password','password']]:[['email','Email','email'],['password','Password','password']];for(const [key,label,type] of keys){const l=document.createElement('label');l.textContent=label;const i=document.createElement('input');i.name=key;i.type=type;i.required=true;if((key==='password'||key==='password_confirm')&&which!=='login')i.minLength=12;l.append(i);form.append(l)}if(which==='register'){const l=document.createElement('label');l.textContent='Account type';const select=document.createElement('select');select.name='role';select.style.cssText='width:100%;padding:12px;border:1px solid #cbd5d0;border-radius:8px';select.add(new Option('— Select account type —',''));select.add(new Option('Customer','customer'));select.add(new Option('Vendor / subcontractor','vendor'));select.required=true;l.append(select);form.prepend(l);const cl=document.createElement('label');cl.textContent='Confirm account type';const cs=document.createElement('select');cs.name='role_confirm';cs.style.cssText=select.style.cssText;cs.add(new Option('— Confirm account type —',''));cs.add(new Option('Customer','customer'));cs.add(new Option('Vendor / subcontractor','vendor'));cs.required=true;cl.append(cs);l.after(cl)}const b=document.createElement('button');b.className='submit';b.textContent=which==='register'?'Submit registration':which==='reset'?'Update password':'Sign in';form.append(b);const status=document.createElement('p');form.append(status);form.onsubmit=async e=>{e.preventDefault();b.disabled=true;try{const payload=Object.fromEntries(new FormData(form));if(which==='register'&&(payload.role!==payload.role_confirm||payload.password!==payload.password_confirm))throw Error('Account type and passwords must match their confirmations');if(which==='reset'){payload.token=location.hash.slice(7)}const r=await fetch('/doorks-portals/accounts/'+(which==='register'?'register':which==='reset'?'reset-password':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok)throw Error(data.detail||'Request failed');if(which==='register'||which==='reset'){form.remove();status.textContent=data.message;section.append(status)}else if(data.role==='vendor')await vendorDashboard();else await dashboard();}catch(err){status.textContent=err.message}finally{b.disabled=false}};section.append(form);if(which==='login'){const forgot=document.createElement('button');forgot.type='button';forgot.textContent='Forgot password?';forgot.style.cssText='margin-top:14px;background:transparent;border:0;text-decoration:underline;cursor:pointer;color:#365b3b';forgot.onclick=async()=>{const email=form.querySelector('[name=email]').value.trim();if(!email){status.textContent='Enter your email above first.';return}try{const r=await fetch('/doorks-portals/accounts/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});const d=await r.json();status.textContent=d.message||'Request received'}catch(e){status.textContent='Unable to submit request'}};section.append(forgot)}app.append(section);const back=document.createElement('p');back.innerHTML='<a href="/doorks-portals/home">Back to options</a>';app.append(back)}
async function api(path,options){const r=await fetch('/doorks-portals/'+path,{cache:'no-store',...options});const d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d}
async function vendorDashboard(){const me=await api('vendor-account/me');const r=await api('vendor-account/records');landing.hidden=true;app.hidden=false;app.replaceChildren();const heading=document.createElement('h2');heading.textContent='Vendor Service Center · '+me.company;app.append(heading);const logout=document.createElement('button');logout.className='submit';logout.textContent='Sign out';logout.onclick=async()=>{await api('accounts/logout',{method:'POST'});location.href='/doorks-portals/home'};app.append(logout);const nav=document.createElement('nav');nav.style.cssText='display:flex;gap:10px;flex-wrap:wrap;margin:18px 0';app.append(nav);const main=document.createElement('div');app.append(main);const pages=[['Dashboard',()=>{main.replaceChildren();const info=document.createElement('section');info.innerHTML='<h2>Overview</h2>';info.append(document.createTextNode(r.assignments.length+' assignments · '+r.purchase_orders.length+' purchase orders'));main.append(info)}],['Assignments & Schedule',()=>{main.replaceChildren();const box=document.createElement('section');box.innerHTML='<h2>Assigned Work Orders</h2>';for(const a of r.assignments){const d=document.createElement('div');d.className='item';d.textContent=[a.work_order_number,a.status,a.scheduled_date,a.scheduled_time,a.address,a.scope,a.notes].filter(Boolean).join(' · ');box.append(d)}if(!r.assignments.length)box.append(document.createTextNode('No active assignments.'));main.append(box)}],['Purchase Orders',()=>{main.replaceChildren();const box=document.createElement('section');box.innerHTML='<h2>Purchase Orders</h2>';for(const po of r.purchase_orders){const d=document.createElement('div');d.className='item';d.textContent=[po.po_number,po.status,po.expected_date,po.description].filter(Boolean).join(' · ');box.append(d)}if(!r.purchase_orders.length)box.append(document.createTextNode('No purchase orders.'));main.append(box)}]];for(const [name,action] of pages){const b=document.createElement('button');b.className='submit';b.textContent=name;b.onclick=action;nav.append(b)}pages[0][1]();}
async function dashboard(){const me=await api('accounts/me');landing.hidden=true;app.hidden=false;app.replaceChildren();const title=document.createElement('h2');title.textContent='Welcome, '+me.name;app.append(title);const logout=document.createElement('button');logout.className='submit';logout.textContent='Sign out';logout.onclick=async()=>{await api('accounts/logout',{method:'POST'});location.href='/doorks-portals/home'};app.append(logout);const [docs,jobs]=await Promise.all([api('accounts/documents'),api('accounts/work-orders')]);const orders=document.createElement('section');orders.innerHTML='<h2>My Work Orders</h2>';for(const j of jobs.work_orders){const d=document.createElement('div');d.className='item';d.textContent=[j.job_number||j.work_order_number,j.status,j.address,j.scheduled_date].filter(Boolean).join(' · ');orders.append(d)}if(!jobs.work_orders.length)orders.append(document.createTextNode('No linked work orders.'));app.append(orders);const invoices=document.createElement('section');invoices.innerHTML='<h2>Estimates & Invoices</h2>';for(const doc of docs.documents){const d=document.createElement('div');d.className='item';const total=document.createElement('strong');total.textContent=[doc.document_type,doc.document_number,'$'+Number(doc.amount||0).toFixed(2),'Balance $'+Number(doc.balance_due||0).toFixed(2)].join(' · ');d.append(total);if(doc.document_type==='Invoice'&&doc.balance_due>0){const b=document.createElement('button');b.className='submit';b.style.marginLeft='12px';b.textContent='Pay securely';b.onclick=async()=>{b.disabled=true;try{const r=await api('accounts/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({document_id:doc.id})});location.href=r.url}catch(e){alert(e.message);b.disabled=false}};d.append(b)}invoices.append(d)}if(!docs.documents.length)invoices.append(document.createTextNode('No released documents linked to this customer account.'));app.append(invoices);const payments=await api('accounts/payments');const receipts=document.createElement('section');receipts.innerHTML='<h2>Payment History</h2>';for(const payment of payments.payments){const row=document.createElement('div');row.className='item';row.textContent='Invoice '+payment.invoice_id+' · $'+Number(payment.amount).toFixed(2)+' · '+payment.status+' · '+payment.paid_at;receipts.append(row)}if(!payments.payments.length)receipts.append(document.createTextNode('No Stripe payments recorded yet.'));app.append(receipts)}

function portalLayout(title,navItems){
  landing.hidden=true;app.hidden=false;app.replaceChildren();app.style.maxWidth='1320px';
  const shell=document.createElement('div');shell.className='portal-shell';
  const sidebar=document.createElement('aside');sidebar.className='portal-sidebar';
  const brand=document.createElement('h2');brand.textContent=title;sidebar.append(brand);
  const content=document.createElement('div');content.className='portal-content';shell.append(sidebar,content);app.append(shell);
  const buttons=new Map();
  for(const [id,label,handler] of navItems){const b=document.createElement('button');b.className='portal-nav';b.textContent=label;b.onclick=()=>{for(const x of buttons.values())x.classList.remove('selected');b.classList.add('selected');content.replaceChildren();handler(content)};sidebar.append(b);buttons.set(id,b)}
  const signout=document.createElement('button');signout.className='portal-nav';signout.textContent='Sign out';signout.onclick=async()=>{await api('accounts/logout',{method:'POST'});location.href='/doorks-portals/home'};sidebar.append(signout);
  return {content,open:id=>buttons.get(id)?.click()};
}
function portalCard(host,title,detail,click){const c=document.createElement('button');c.className='portal-card';const h=document.createElement('strong');h.textContent=title;const p=document.createElement('p');p.textContent=detail||'';c.append(h,p);if(click)c.onclick=click;else c.disabled=true;host.append(c);return c}
function portalDetails(title,fields){const backdrop=document.createElement('div');backdrop.style.cssText='position:fixed;inset:0;z-index:30000;background:#142b2480;display:flex;justify-content:flex-end';const panel=document.createElement('section');panel.style.cssText='background:#fff;width:min(620px,100vw);height:100%;overflow:auto;padding:24px;box-sizing:border-box';const heading=document.createElement('h2');heading.textContent=title;const close=document.createElement('button');close.className='submit';close.textContent='Close';close.onclick=()=>backdrop.remove();panel.append(heading,close);for(const [label,value] of fields){if(value===null||value===undefined||value==='')continue;const p=document.createElement('p');const strong=document.createElement('strong');strong.textContent=label+': ';p.append(strong,document.createTextNode(String(value)));panel.append(p)}backdrop.append(panel);backdrop.ondblclick=e=>{if(e.target===backdrop)backdrop.remove()};document.body.append(backdrop);return panel}
function portalJobDetails(job){
 const panel=portalDetails(job.job_number||job.work_order_number||'Work order',[
 ['Status',job.status],['Priority',job.priority||job.urgency],['Customer',job.customer],
 ['Service address',job.address],['Service',job.service_type],
 ['Scheduled date',job.scheduled_date],['Scheduled time',job.scheduled_time],
 ['Schedule confirmation',job.schedule_confirmation],['Assigned vendor',job.assigned_vendor||'Office coordinating'],
 ['Vendor progress',job.vendor_status],['Description',job.description],
 ['Customer-visible notes',job.customer_visible_notes||job.customer_visible_tech_notes||job.customer_notes]]);
 const heading=document.createElement('h3');heading.textContent='Request a work order change';panel.append(heading);
 const hint=document.createElement('p');hint.textContent='Your request goes to the office for review. It does not automatically change the confirmed schedule or job.';panel.append(hint);
 const form=document.createElement('form');const type=document.createElement('select');
 for(const [v,t] of [['details_update','Update job details'],['schedule_change','Request schedule change'],['cancel_request','Request cancellation'],['question','Ask the office']])type.add(new Option(t,v));
 const date=document.createElement('input');date.type='date';date.title='Requested date (optional)';
 const time=document.createElement('input');time.type='time';time.title='Requested time (optional)';
 const note=document.createElement('textarea');note.required=true;note.minLength=3;note.maxLength=3000;note.placeholder='Describe the change or question';note.style.cssText='width:100%;min-height:90px;margin:10px 0';
 const button=document.createElement('button');button.className='submit';button.textContent='Send request to office';const feedback=document.createElement('p');
 form.append(type,date,time,note,button,feedback);form.onsubmit=async e=>{e.preventDefault();button.disabled=true;try{await api('accounts/work-orders/change-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({work_order_id:job.id,request_type:type.value,requested_date:date.value,requested_time:time.value,note:note.value})});feedback.textContent='Request submitted for office review.';note.value=''}catch(err){feedback.textContent=err.message}finally{button.disabled=false}};panel.append(form);
}
function portalDocumentDetails(doc){const panel=portalDetails((doc.document_type||'Document')+' '+(doc.document_number||''),[['Status',doc.status],['Total',Number(doc.amount||0).toLocaleString('en-US',{style:'currency',currency:'USD'})],['Balance',Number(doc.balance_due||0).toLocaleString('en-US',{style:'currency',currency:'USD'})],['Date',doc.date],['Notes',doc.notes]]);if(doc.document_type==='Invoice'&&Number(doc.balance_due)>0){const pay=document.createElement('button');pay.className='submit';pay.textContent='Pay securely with Stripe';pay.onclick=async()=>{pay.disabled=true;try{const r=await api('accounts/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({document_id:doc.id})});location.href=r.url}catch(err){alert(err.message);pay.disabled=false}};panel.append(pay)}}
function portalHeading(host,text){const h=document.createElement('h2');h.textContent=text;host.append(h)}
function portalCalendar(host,jobs,onOpen){const today=new Date();let month=new Date(today.getFullYear(),today.getMonth(),1);const calendar=document.createElement('div');host.append(calendar);const render=()=>{calendar.replaceChildren();const head=document.createElement('div');head.className='calendar-head';const prev=document.createElement('button');prev.textContent='←';prev.onclick=()=>{month.setMonth(month.getMonth()-1);render()};const next=document.createElement('button');next.textContent='→';next.onclick=()=>{month.setMonth(month.getMonth()+1);render()};const label=document.createElement('strong');label.textContent=month.toLocaleString(undefined,{month:'long',year:'numeric'});head.append(prev,label,next);calendar.append(head);const grid=document.createElement('div');grid.className='portal-calendar';for(const day of ['Sun','Mon','Tue','Wed','Thu','Fri','Sat']){const d=document.createElement('b');d.textContent=day;grid.append(d)}for(let i=0;i<new Date(month.getFullYear(),month.getMonth(),1).getDay();i++)grid.append(document.createElement('span'));for(let day=1;day<=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();day++){const cell=document.createElement('div');cell.className='calendar-day';const n=document.createElement('strong');n.textContent=day;cell.append(n);const key=[month.getFullYear(),String(month.getMonth()+1).padStart(2,'0'),String(day).padStart(2,'0')].join('-');for(const j of jobs.filter(j=>String(j.scheduled_date||'').slice(0,10)===key)){const t=document.createElement('small');t.textContent=(j.job_number||j.work_order_number||'Work order')+' · '+(j.status||'Scheduled');if(onOpen){t.style.cursor='pointer';t.tabIndex=0;t.setAttribute('role','button');t.onclick=()=>onOpen(j);t.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();onOpen(j)}}}cell.append(t)}grid.append(cell)}calendar.append(grid)};render()}
async function dashboard(){const [me,docs,jobs,payments]=await Promise.all([api('accounts/me'),api('accounts/documents'),api('accounts/work-orders'),api('accounts/payments')]);const work=jobs.work_orders||[],documents=docs.documents||[],paid=payments.payments||[];
 const pages=[['home','🏠 Dashboard',v=>{portalHeading(v,'Welcome, '+me.name);const stats=document.createElement('div');stats.className='portal-stats';for(const [name,value] of [['Work orders',work.length],['Upcoming visits',work.filter(j=>j.scheduled_date&&j.scheduled_date>=new Date().toISOString().slice(0,10)).length],['Estimates & invoices',documents.length],['Payments',paid.length]]){const d=document.createElement('div');d.className='portal-stat';d.innerHTML='<b>'+value+'</b>';const p=document.createElement('span');p.textContent=name;d.append(p);stats.append(d)}v.append(stats);portalHeading(v,'My schedule');portalCalendar(v,work,portalJobDetails);portalHeading(v,'Recent work orders');for(const j of work.slice(-5).reverse())portalCard(v,j.job_number||j.work_order_number||'Work order',[j.status,j.address,j.scheduled_date].filter(Boolean).join(' · '),()=>portalJobDetails(j));}],['jobs','🛠 Work Orders',v=>{portalHeading(v,'My Work Orders');for(const j of work)portalCard(v,j.job_number||j.work_order_number||'Work order',[j.status,j.address,j.scheduled_date,j.scheduled_time,j.description].filter(Boolean).join(' · '),()=>portalJobDetails(j));if(!work.length)v.append('No linked work orders. Contact the office to verify your customer record.')}],['docs','📄 Estimates & Invoices',v=>{portalHeading(v,'Estimates & Invoices');for(const d of documents){const card=portalCard(v,(d.document_type||'Document')+' '+(d.document_number||''),[d.status,'Total $'+Number(d.amount||0).toFixed(2),'Balance $'+Number(d.balance_due||0).toFixed(2)].join(' · '),()=>portalDocumentDetails(d));if(d.document_type==='Invoice'&&Number(d.balance_due)>0){const b=document.createElement('button');b.className='submit';b.textContent='Pay securely with Stripe';b.onclick=async()=>{b.disabled=true;try{const r=await api('accounts/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({document_id:d.id})});location.href=r.url}catch(e){alert(e.message);b.disabled=false}};card.after(b)}}if(!documents.length)v.append('No released documents linked to this account.')}],['payments','💳 Payments',v=>{portalHeading(v,'Payment History');for(const p of paid)portalCard(v,'Invoice '+p.invoice_id,'$'+Number(p.amount||0).toFixed(2)+' · '+p.status+' · '+p.paid_at);if(!paid.length)v.append('No confirmed Stripe payments yet.')}]];
 const ui=portalLayout('Customer Service Center',pages);document.getElementById('portalHome').onclick=()=>ui.open('home');ui.open('home');}
async function vendorDashboard(){
 const [me,records,commercial]=await Promise.all([api('vendor-account/me'),api('vendor-account/records'),api('vendor-account/commercial-documents')]);
 const assignments=records.assignments||[];
 const urgent=x=>/emergency|urgent|critical/i.test([x.priority,x.urgency,x.service_priority].join(' '));
 const open=x=>!/finished|completed|cancelled|declined/i.test(x.status||'');
 const sorted=assignments.slice().sort((a,b)=>Number(urgent(b))-Number(urgent(a))||Number(open(b))-Number(open(a))||String(a.scheduled_date||'').localeCompare(String(b.scheduled_date||'')));
 const details=(v,r)=>{
   const c=portalCard(v,(urgent(r)?'🚨 EMERGENCY · ':'')+(r.work_order_number||'Assignment'),[r.status,r.customer,r.address,r.scheduled_date,r.scheduled_time,r.scope||r.description].filter(Boolean).join(' · '),()=>{
     const panel=portalDetails(r.work_order_number||'Assigned work order', [['Priority',r.priority||r.urgency||'Normal'],['Status',r.status],['Customer',r.customer],['Service address',r.address],['Job location',r.job_location],['Access instructions',r.access_instructions],['Contact',r.contact],['Contact phone',r.contact_phone],['Scheduled', [r.scheduled_date,r.scheduled_time].filter(Boolean).join(' ')],['Scope of work',r.scope||r.description],['Office notes',r.notes]]);
     const note=document.createElement('textarea');note.placeholder='Field notes / work performed / parts needed';note.style.cssText='display:block;width:100%;min-height:95px;margin:12px 0';panel.append(note);
     if(String(r.status).toLowerCase()==='offered')for(const [label,decision] of [['Accept work order','accepted'],['Decline work order','declined']]){const b=document.createElement('button');b.className='submit';b.textContent=label;b.onclick=async()=>{if(!confirm(label+'?'))return;b.disabled=true;try{await api('vendor-account/assignments/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({assignment_id:r.id,decision})});await vendorDashboard()}catch(e){alert(e.message);b.disabled=false}};panel.append(b)}
     const stages={accepted:['En Route','Additional Work Required','Estimate Required','Parts Required'],'en route':['Arrived','Additional Work Required'],arrived:['In Progress','Additional Work Required','Estimate Required','Parts Required'],'in progress':['Finished','Additional Work Required','Estimate Required','Parts Required'],'additional work required':['In Progress','Estimate Required','Parts Required'],'estimate required':['In Progress','Parts Required'],'parts required':['In Progress']};
     const options=stages[String(r.status||'').toLowerCase()]||[];
     if(options.length){const label=document.createElement('h3');label.textContent='Update job progress';panel.append(label);const select=document.createElement('select');select.style.cssText='padding:12px;width:100%;margin-bottom:10px';for(const stage of options)select.add(new Option(stage,stage));panel.append(select);const update=document.createElement('button');update.className='submit';update.textContent='Save progress update';update.onclick=async()=>{update.disabled=true;try{await api('vendor-account/assignments/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({assignment_id:r.id,status:select.value,note:note.value})});await vendorDashboard()}catch(e){alert(e.message);update.disabled=false}};panel.append(update)}
     const h=document.createElement('h3');h.textContent='Upload job photos, estimate, invoice or completion document';panel.append(h);const file=document.createElement('input');file.type='file';file.accept='.pdf,.jpg,.jpeg,.png,.webp';const send=document.createElement('button');send.className='submit';send.textContent='Upload to office';const status=document.createElement('p');send.onclick=async()=>{if(!file.files.length){status.textContent='Select a file first';return}send.disabled=true;const fd=new FormData();fd.append('record_type','assignment');fd.append('record_id',r.id);fd.append('note',note.value);fd.append('file',file.files[0]);try{const response=await fetch('/doorks-portals/vendor-account/upload',{method:'POST',body:fd,credentials:'same-origin'});const data=await response.json();if(!response.ok)throw Error(data.detail||'Upload failed');status.textContent='File submitted for office review';file.value=''}catch(e){status.textContent=e.message}finally{send.disabled=false}};panel.append(file,send,status);
     const docs=(commercial.documents||[]).filter(d=>d.assignment_id===r.id);
     const title=document.createElement('h3');title.textContent='Estimates & invoices';panel.append(title);
     for(const d of docs){const line=document.createElement('p');line.textContent=d.document_type.toUpperCase()+' · $'+Number(d.amount).toFixed(2)+' · '+d.status+' · '+d.description;panel.append(line)}
     for(const type of ['estimate','invoice']){const form=document.createElement('form');form.style.cssText='border:1px solid #d6dfd6;border-radius:12px;padding:12px;margin:10px 0';const h=document.createElement('strong');h.textContent='Create '+type;const desc=document.createElement('textarea');desc.placeholder='Description / line-item summary';desc.required=true;desc.maxLength=3000;desc.style.cssText='display:block;width:100%;min-height:75px;margin:8px 0';const amount=document.createElement('input');amount.type='number';amount.step='0.01';amount.min='0';amount.max='100000000';amount.required=true;amount.placeholder='Total amount (USD)';const ref=document.createElement('input');ref.placeholder='Your reference number (optional)';ref.maxLength=100;const submit=document.createElement('button');submit.className='submit';submit.textContent='Submit '+type+' for office review';const msg=document.createElement('p');form.append(h,desc,amount,ref,submit,msg);form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;try{await api('vendor-account/commercial-documents',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({assignment_id:r.id,document_type:type,description:desc.value,amount:Number(amount.value),reference:ref.value})});msg.textContent='Submitted to office. Not posted to accounting.';await vendorDashboard()}catch(e){msg.textContent=e.message;submit.disabled=false}};panel.append(form)}
     const threadTitle=document.createElement('h3');threadTitle.textContent='Messages with office';panel.append(threadTitle);const thread=document.createElement('div');panel.append(thread);const refresh=async()=>{try{const data=await api('vendor-account/assignments/'+encodeURIComponent(r.id)+'/messages');thread.replaceChildren();for(const m of data.messages){const line=document.createElement('p');line.textContent=(m.sender==='office'?'Office':'You')+' · '+new Date(m.created_at).toLocaleString()+' — '+m.message;thread.append(line)}if(!data.messages.length)thread.textContent='No messages yet.'}catch(e){thread.textContent=e.message}};refresh();const message=document.createElement('textarea');message.placeholder='Ask a question or provide a job update';message.maxLength=3000;message.style.cssText='width:100%;min-height:75px';const sendMessage=document.createElement('button');sendMessage.className='submit';sendMessage.textContent='Send message';sendMessage.onclick=async()=>{sendMessage.disabled=true;try{await api('vendor-account/assignments/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({assignment_id:r.id,message:message.value})});message.value='';await refresh()}catch(e){alert(e.message)}finally{sendMessage.disabled=false}};panel.append(message,sendMessage)
   });return c;
 };
 const pages=[
 ['home','🏠 Dashboard',v=>{portalHeading(v,'Welcome, '+me.company);const stats=document.createElement('div');stats.className='portal-stats';for(const [name,value] of [['Emergency',assignments.filter(x=>urgent(x)&&open(x)).length],['Open work orders',assignments.filter(open).length],['Completed',assignments.filter(x=>!open(x)).length],['Scheduled',assignments.filter(x=>x.scheduled_date&&open(x)).length]]){const d=document.createElement('div');d.className='portal-stat';const b=document.createElement('b');b.textContent=value;const t=document.createElement('span');t.textContent=name;d.append(b,t);stats.append(d)}v.append(stats);portalHeading(v,'My assignment calendar');portalCalendar(v,assignments,j=>{const card=details(v,j);card.click();card.remove()});portalHeading(v,'Priority work orders');for(const x of sorted.filter(open).slice(0,8))details(v,x)}],
 ['open','🚨 Open Work Orders',v=>{portalHeading(v,'Open Work Orders');for(const x of sorted.filter(open))details(v,x);if(!assignments.some(open))v.append('No open assignments.') }],
 ['history','🛠 All Work Orders',v=>{portalHeading(v,'All & Past Work Orders');for(const x of sorted)details(v,x);if(!sorted.length)v.append('No assignments yet.') }],
 ['documents','📄 Estimates, Invoices & Uploads',v=>{portalHeading(v,'Job Documents');v.append('Open an assigned work order to create a vendor estimate or invoice, upload supporting documents, or message the office. Documents require office review and do not automatically post to accounting.');for(const x of sorted)details(v,x)}]
 ];
 const ui=portalLayout('Vendor Service Center',pages);document.getElementById('portalHome').onclick=()=>ui.open('home');ui.open('home');
}

const moses=document.createElement('button');moses.textContent='✨ Moses';moses.type='button';moses.style.cssText='position:fixed;right:22px;bottom:22px;z-index:29000;background:#365b3b;color:white;border:0;border-radius:40px;padding:15px 22px;box-shadow:0 6px 24px #0003;font-weight:700';moses.onclick=()=>{const panel=portalDetails('Moses · Service Assistant',[['Service','Use Work Orders to review scheduled work, Estimates & Invoices to review charges, and Payments for confirmed receipts.'],['Help','For changes to a job, contact the Doorks office. Conversational AI is not yet enabled in the external portal.']]);};document.body.append(moses);
api('vendor-account/me').then(()=>vendorDashboard()).catch(()=>api('accounts/me').then(()=>dashboard()).catch(()=>{}));if(location.search.includes('payment=return'))alert('Checkout returned. Payment status will update after Stripe confirms it.');
</script></body></html>

-width:90px;text-align:right}.portal-sidebar{grid-template-columns:repeat(2,minmax(0,1fr))}.portal-sidebar h2{grid-column:1/-1}.portal-nav{font-size:13px;padding:9px}}  .portal-sidebar{border-radius:12px;box-shadow:0 2px 10px #1231}.portal-card{border-left:4px solid #365b3b}.portal-nav.selected{border-left:4px solid #365b3b}.portal-content{padding:4px 8px}.portal-drawer-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0;border-bottom:1px solid #d9e2da;padding-bottom:12px}.portal-drawer-tabs button{padding:9px 14px;border:1px solid #cddbd0;background:#f8faf8;border-radius:9px;font-weight:700;cursor:pointer}.portal-drawer-tabs button.active{background:#365b3b;color:white}.portal-ticket-header{padding:18px;border:1px solid #d6dfd6;border-radius:12px;background:#f5f9f5}.portal-ticket-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.portal-ticket-grid>div{border-bottom:1px solid #e5ebe5;padding:10px 0;overflow-wrap:anywhere}.portal-ticket-grid small{display:block;color:#65736b}.portal-success{position:fixed;inset:0;z-index:50000;background:#152a2299;display:grid;place-items:center;padding:16px}.portal-success>div{background:white;border-radius:18px;max-width:460px;padding:30px;box-shadow:0 20px 60px #0004;text-align:center}.portal-line-row{display:grid;grid-template-columns:minmax(0,3fr) 70px 110px 36px;gap:8px;align-items:center}.portal-line-row input{min-width:0}.portal-estimate-editor{max-width:none!important;width:100%;margin:0}.portal-estimate-editor .portal-line-row{margin:8px 0}@media(max-width:650px){.portal-ticket-grid{grid-template-columns:1fr}.portal-line-row{grid-template-columns:minmax(0,1fr) 65px 90px 30px}}</style><link rel="stylesheet" href="/static/doorks_shared_ticket.css"><link rel="stylesheet" href="/static/doorks_portal_polish.css"></head><body><header><button id="portalHome" type="button" title="Return to dashboard and calendar" aria-label="Dashboard and calendar" style="background:transparent;border:0;color:white;font-size:28px;cursor:pointer">📅</button><b style="position:absolute;left:50%;transform:translateX(-50%)">Doorks</b><span>Service & Customer Portal</span></header><main><div id="landing"><h1>How can we help?</h1><p>Request service, create a customer or vendor account, or sign in to your secure service center.</p><div class="cards"><button class="tile" onclick="location.href='/doorks-portals/request-service'"><svg viewBox="0 0 100 100"><path d="M20 15h42l18 18v52H20zM62 15v20h18M30 50h40M30 62h40M30 74h25"/></svg><strong>New Inquiry</strong><span>Tell us about a job or project</span></button><button class="tile" onclick="show('register')"><svg viewBox="0 0 100 100"><circle cx="42" cy="30" r="16"/><path d="M15 80V68q0-20 27-20t27 20v12M78 45v30M63 60h30"/></svg><strong>Create Account</strong><span>Register as a customer or vendor</span></button><button class="tile" onclick="show('login')"><svg viewBox="0 0 100 100"><rect x="20" y="44" width="60" height="44" rx="7"/><path d="M33 44V28a17 17 0 0134 0v16M50 60v15"/></svg><strong>Login</strong><span>Customer and vendor service centers</span></button></div></div><div id="app" hidden></div></main><script src="/static/doorks_shared_ticket.js"></script><script>
const app=document.getElementById('app'),landing=document.getElementById('landing');if(location.hash.startsWith('#reset='))setTimeout(()=>show('reset'),0);function show(which){landing.hidden=true;app.hidden=false;app.replaceChildren();const h=document.createElement('h2');h.textContent=which==='register'?'Create your account':which==='reset'?'Set a new password':'Customer or vendor login';const section=document.createElement('section');section.append(h);const form=document.createElement('form');const keys=which==='register'?[['contact_name','Contact name','text'],['company','Company','text'],['email','Email','email'],['password','Password (12+ characters)','password'],['password_confirm','Retype password','password']]:which==='reset'?[['password','New password (12+ characters)','password'],['password_confirm','Retype new password','password']]:[['email','Email','email'],['password','Password','password']];for(const [key,label,type] of keys){const l=document.createElement('label');l.textContent=label;const i=document.createElement('input');i.name=key;i.type=type;i.required=true;if((key==='password'||key==='password_confirm')&&which!=='login')i.minLength=12;l.append(i);form.append(l)}if(which==='register'){const l=document.createElement('label');l.textContent='Account type';const select=document.createElement('select');select.name='role';select.style.cssText='width:100%;padding:12px;border:1px solid #cbd5d0;border-radius:8px';select.add(new Option('— Select account type —',''));select.add(new Option('Customer','customer'));select.add(new Option('Vendor / subcontractor','vendor'));select.required=true;l.append(select);form.prepend(l);const cl=document.createElement('label');cl.textContent='Confirm account type';const cs=document.createElement('select');cs.name='role_confirm';cs.style.cssText=select.style.cssText;cs.add(new Option('— Confirm account type —',''));cs.add(new Option('Customer','customer'));cs.add(new Option('Vendor / subcontractor','vendor'));cs.required=true;cl.append(cs);l.after(cl)}const b=document.createElement('button');b.className='submit';b.textContent=which==='register'?'Submit registration':which==='reset'?'Update password':'Sign in';form.append(b);const status=document.createElement('p');form.append(status);form.onsubmit=async e=>{e.preventDefault();b.disabled=true;try{const payload=Object.fromEntries(new FormData(form));if(which==='register'&&(payload.role!==payload.role_confirm||payload.password!==payload.password_confirm))throw Error('Account type and passwords must match their confirmations');if(which==='reset'){payload.token=location.hash.slice(7)}const r=await fetch('/doorks-portals/accounts/'+(which==='register'?'register':which==='reset'?'reset-password':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await r.json();if(!r.ok)throw Error(data.detail||'Request failed');if(which==='register'||which==='reset'){form.remove();status.textContent=data.message;section.append(status)}else if(data.role==='vendor')await vendorDashboard();else await dashboard();}catch(err){status.textContent=err.message}finally{b.disabled=false}};section.append(form);if(which==='login'){const forgot=document.createElement('button');forgot.type='button';forgot.textContent='Forgot password?';forgot.style.cssText='margin-top:14px;background:transparent;border:0;text-decoration:underline;cursor:pointer;color:#365b3b';forgot.onclick=async()=>{const email=form.querySelector('[name=email]').value.trim();if(!email){status.textContent='Enter your email above first.';return}try{const r=await fetch('/doorks-portals/accounts/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});const d=await r.json();status.textContent=d.message||'Request received'}catch(e){status.textContent='Unable to submit request'}};section.append(forgot)}app.append(section);const back=document.createElement('p');back.innerHTML='<a href="/doorks-portals/home">Back to options</a>';app.append(back)}
async function api(path,options){const r=await fetch('/doorks-portals/'+path,{cache:'no-store',...options});const d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d}
async function vendorDashboard(){const me=await api('vendor-account/me');const r=await api('vendor-account/records');landing.hidden=true;app.hidden=false;app.replaceChildren();const heading=document.createElement('h2');heading.textContent='Vendor Service Center · '+me.company;app.append(heading);const logout=document.createElement('button');logout.className='submit';logout.textContent='Sign out';logout.onclick=async()=>{await api('accounts/logout',{method:'POST'});location.href='/doorks-portals/home'};app.append(logout);const nav=document.createElement('nav');nav.style.cssText='display:flex;gap:10px;flex-wrap:wrap;margin:18px 0';app.append(nav);const main=document.createElement('div');app.append(main);const pages=[['Dashboard',()=>{main.replaceChildren();const info=document.createElement('section');info.innerHTML='<h2>Overview</h2>';info.append(document.createTextNode(r.assignments.length+' assignments · '+r.purchase_orders.length+' purchase orders'));main.append(info)}],['Assignments & Schedule',()=>{main.replaceChildren();const box=document.createElement('section');box.innerHTML='<h2>Assigned Work Orders</h2>';for(const a of r.assignments){const d=document.createElement('div');d.className='item';d.textContent=[a.work_order_number,a.status,a.scheduled_date,a.scheduled_time,a.address,a.scope,a.notes].filter(Boolean).join(' · ');box.append(d)}if(!r.assignments.length)box.append(document.createTextNode('No active assignments.'));main.append(box)}],['Purchase Orders',()=>{main.replaceChildren();const box=document.createElement('section');box.innerHTML='<h2>Purchase Orders</h2>';for(const po of r.purchase_orders){const d=document.createElement('div');d.className='item';d.textContent=[po.po_number,po.status,po.expected_date,po.description].filter(Boolean).join(' · ');box.append(d)}if(!r.purchase_orders.length)box.append(document.createTextNode('No purchase orders.'));main.append(box)}]];for(const [name,action] of pages){const b=document.createElement('button');b.className='submit';b.textContent=name;b.onclick=action;nav.append(b)}pages[0][1]();}
async function dashboard(){const me=await api('accounts/me');landing.hidden=true;app.hidden=false;app.replaceChildren();const title=document.createElement('h2');title.textContent='Welcome, '+me.name;app.append(title);const logout=document.createElement('button');logout.className='submit';logout.textContent='Sign out';logout.onclick=async()=>{await api('accounts/logout',{method:'POST'});location.href='/doorks-portals/home'};app.append(logout);const [docs,jobs]=await Promise.all([api('accounts/documents'),api('accounts/work-orders')]);const orders=document.createElement('section');orders.innerHTML='<h2>My Work Orders</h2>';for(const j of jobs.work_orders){const d=document.createElement('div');d.className='item';d.textContent=[j.job_number||j.work_order_number,j.status,j.address,j.scheduled_date].filter(Boolean).join(' · ');orders.append(d)}if(!jobs.work_orders.length)orders.append(document.createTextNode('No linked work orders.'));app.append(orders);const invoices=document.createElement('section');invoices.innerHTML='<h2>Estimates & Invoices</h2>';for(const doc of docs.documents){const d=document.createElement('div');d.className='item';const total=document.createElement('strong');total.textContent=[doc.document_type,doc.document_number,'$'+Number(doc.amount||0).toFixed(2),'Balance $'+Number(doc.balance_due||0).toFixed(2)].join(' · ');d.append(total);if(doc.document_type==='Invoice'&&doc.balance_due>0){const b=document.createElement('button');b.className='submit';b.style.marginLeft='12px';b.textContent='Pay securely';b.onclick=async()=>{b.disabled=true;try{const r=await api('accounts/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({document_id:doc.id})});location.href=r.url}catch(e){alert(e.message);b.disabled=false}};d.append(b)}invoices.append(d)}if(!docs.documents.length)invoices.append(document.createTextNode('No released documents linked to this customer account.'));app.append(invoices);const payments=await api('accounts/payments');const receipts=document.createElement('section');receipts.innerHTML='<h2>Payment History</h2>';for(const payment of payments.payments){const row=document.createElement('div');row.className='item';row.textContent='Invoice '+payment.invoice_id+' · $'+Number(payment.amount).toFixed(2)+' · '+payment.status+' · '+payment.paid_at;receipts.append(row)}if(!payments.payments.length)receipts.append(document.createTextNode('No Stripe payments recorded yet.'));app.append(receipts)}
// Rev 67.1: unified permanent account service center, separate customer/vendor permissions.
function portalLayout(title,navItems){
  landing.hidden=true;app.hidden=false;app.replaceChildren();app.style.maxWidth='1320px';
  const shell=document.createElement('div');shell.className='portal-shell';
  const sidebar=document.createElement('aside');sidebar.className='portal-sidebar';
  const brand=document.createElement('h2');brand.textContent=title;sidebar.append(brand);
  const content=document.createElement('div');content.className='portal-content';shell.append(sidebar,content);app.append(shell);
  const buttons=new Map();
  for(const [id,label,handler] of navItems){const b=document.createElement('button');b.className='portal-nav';b.textContent=label;b.onclick=()=>{for(const x of buttons.values())x.classList.remove('selected');b.classList.add('selected');content.replaceChildren();handler(content)};sidebar.append(b);buttons.set(id,b)}
  const signout=document.createElement('button');signout.className='portal-nav';signout.textContent='Sign out';signout.onclick=async()=>{await api('accounts/logout',{method:'POST'});location.href='/doorks-portals/home'};sidebar.append(signout);
  return {content,open:id=>buttons.get(id)?.click()};
}
function portalCard(host,title,detail,click){const c=document.createElement('button');c.className='portal-card';const h=document.createElement('strong');h.textContent=title;const p=document.createElement('p');p.textContent=detail||'';c.append(h,p);if(click)c.onclick=click;else c.disabled=true;host.append(c);return c}
function portalDetails(title,fields){
 const backdrop=document.createElement('div');backdrop.style.cssText='position:fixed;inset:0;z-index:30000;background:#142b2480;display:flex;justify-content:flex-end';
 const panel=document.createElement('section');panel.style.cssText='background:#fff;width:min(950px,100vw);max-width:none;margin:0;border-radius:16px 0 0 16px;height:100%;overflow:auto;padding:24px;box-sizing:border-box';
 const top=document.createElement('div');top.className='portal-ticket-header';const heading=document.createElement('h2');heading.textContent=/work order|^\d{4}-\d+|^job /i.test(title)?'Work Order · '+title:title;heading.style.margin='0 0 10px';const close=document.createElement('button');close.className='submit';close.textContent='Close ticket';close.onclick=()=>backdrop.remove();top.append(heading,close);
 const grid=document.createElement('div');grid.className='portal-ticket-grid';for(const [label,value] of fields){if(value===null||value===undefined||value==='')continue;const cell=document.createElement('div');const small=document.createElement('small');small.textContent=label;const strong=document.createElement('strong');strong.textContent=String(value);cell.append(small,strong);grid.append(cell)}top.append(grid);panel.append(top);
 backdrop.append(panel);backdrop.ondblclick=e=>{if(e.target===backdrop)backdrop.remove()};document.body.append(backdrop);return panel;
}
function portalSuccess(title,message){const layer=document.createElement('div');layer.className='portal-success';const box=document.createElement('div');const heading=document.createElement('h2');heading.textContent='✓ '+title;const text=document.createElement('p');text.textContent=message;const close=document.createElement('button');close.className='submit';close.textContent='Continue';close.onclick=()=>layer.remove();box.append(heading,text,close);layer.append(box);document.body.append(layer);close.focus();}

async function portalLiveTicket(panel,workOrderId){
 if(!workOrderId)return;
 const section=document.createElement('section');section.className='portal-shared-work-order';
 const loading=document.createElement('p');loading.textContent='Loading linked Doorks work order…';section.append(loading);
 panel.insertBefore(section,panel.children[1]||null);
 try{
  const response=await api('tickets/'+encodeURIComponent(workOrderId));
  if(!window.DoorksSharedTicket)throw Error('Shared ticket component did not load');
  window.DoorksSharedTicket.openTicket({host:section,record:response.ticket||{},role:response.role,note:response.role==='vendor'?'Vendor: submit field progress and change requests for office review.':response.role==='customer'?'Customer: submit changes for office review. Office controls dispatch and final billing.':''});
 }catch(error){loading.textContent='Linked work-order details unavailable: '+(error.message||error)}
}

function portalJobDetails(job){
 const panel=portalDetails(job.job_number||job.work_order_number||'Work order',[
 ['Status',job.status],['Priority',job.priority||job.urgency],['Customer',job.customer],
 ['Service address',job.address],['Service',job.service_type],
 ['Scheduled date',job.scheduled_date],['Scheduled time',job.scheduled_time],
 ['Schedule confirmation',job.schedule_confirmation],['Assigned vendor',job.assigned_vendor||'Office coordinating'],
 ['Vendor progress',job.vendor_status],['Description',job.description],
 ['Customer-visible notes',job.customer_visible_notes||job.customer_visible_tech_notes||job.customer_notes]]);
 portalLiveTicket(panel,job.id);
 const heading=document.createElement('h3');heading.textContent='Request a work order change';panel.append(heading);
 const hint=document.createElement('p');hint.textContent='Your request goes to the office for review. It does not automatically change the confirmed schedule or job.';panel.append(hint);
 const shared=window.DoorksSharedTicket;
 if(!shared?.createTicketChangeRequest){const error=document.createElement('p');error.textContent='Change request editor unavailable. Please reload the portal.';panel.append(error);return}
 shared.createTicketChangeRequest(panel,{role:'customer',submit:payload=>api('accounts/work-orders/change-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload,work_order_id:job.id})})});
}
function portalNewWorkOrder(){
 const panel=portalDetails('New Work Order Request', [['Routing','Doorks office will review and assign or confirm the preferred vendor before dispatch.']]);
 const form=document.createElement('form');form.style.cssText='display:grid;gap:12px;margin-top:18px';
 const fields=[['Service address','text',true],['Contact name','text',true],['Contact phone','tel',false],['Contact email','email',false],['Site contact / access instructions','textarea',false],['Preferred service date','date',false],['Preferred arrival time','time',false],['Purchase order / reference','text',false],['Service type / job description','textarea',true]];
 const choose=(label,values)=>{const wrap=document.createElement('label');wrap.textContent=label;wrap.style.cssText='display:grid;gap:6px;font-weight:650';const sel=document.createElement('select');sel.style.cssText='width:100%;padding:12px;border:1px solid #cbd5dc;border-radius:10px';for(const v of values)sel.add(new Option(v,v));const other=document.createElement('input');other.placeholder='Please specify';other.maxLength=200;other.hidden=true;other.style.marginTop='6px';sel.onchange=()=>{other.hidden=sel.value!=='Other';other.required=!other.hidden};wrap.append(sel,other);form.append(wrap);return {sel,other,value:()=>sel.value==='Other'?other.value:sel.value}};
 const service=choose('Service category',['Repair & Adjust','Furnish & Install','Replace & Repair','Adjustment & Alignment','Preventive Maintenance','Inspection / Testing','Other']);
 const priority=choose('Priority',['Normal','Scheduled','Urgent','Emergency','Other']);
 const inputs={};for(const [label,type,required] of fields){const wrap=document.createElement('label');wrap.textContent=label;wrap.style.cssText='display:grid;gap:6px;font-weight:650';const input=document.createElement(type==='textarea'?'textarea':'input');if(type!=='textarea')input.type=type;input.required=required;input.maxLength=type==='textarea'?3000:250;input.style.cssText='padding:12px;border:1px solid #cbd5dc;border-radius:10px;width:100%';wrap.append(input);form.append(wrap);inputs[label]=input}
 const send=document.createElement('button');send.className='submit';send.textContent='Submit work order request';const result=document.createElement('p');form.append(send,result);form.onsubmit=async e=>{e.preventDefault();send.disabled=true;try{await api('accounts/work-orders/new-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({address:inputs['Service address'].value,description:inputs['Service type / job description'].value,access_instructions:inputs['Site contact / access instructions'].value,preferred_date:inputs['Preferred service date'].value,preferred_time:inputs['Preferred arrival time'].value,contact_name:inputs['Contact name'].value,contact_phone:inputs['Contact phone'].value,contact_email:inputs['Contact email'].value,reference:inputs['Purchase order / reference'].value,service_type:service.value(),priority:priority.value()})});result.textContent='Submitted to Doorks office for review and vendor assignment.';form.reset()}catch(err){result.textContent=err.message}finally{send.disabled=false}};panel.append(form)
}
function portalVendorGenerator(assignment,type){
 const panel=portalDetails((type==='estimate'?'Estimate':'Invoice')+' Generator · '+(assignment.work_order_number||''),[['Customer',assignment.customer],['Service address',assignment.address],['Work order',assignment.work_order_number],['Office review','Vendor submissions do not post directly to accounting.']]);
 const help=document.createElement('p');help.textContent='Itemized vendor '+type+' for office review. Edit quantities, unit rates and descriptions. This is not a posted Doorks invoice.';panel.append(help);
 const form=document.createElement('form');form.className='portal-estimate-editor';form.style.cssText='display:grid;gap:12px';const items=[];const rows=document.createElement('div');form.append(rows);
 const editor=window.DoorksSharedTicket.openDocument({role:'vendor',host:rows,items,documentType:type,workOrderNumber:assignment.work_order_number,customer:assignment.customer,address:assignment.address});

istory,'Submitted compliance documents');for(const d of data.documents){const card=document.createElement('div');card.className='portal-card';const title=document.createElement('strong');title.textContent=d.type||'Compliance document';const desc=document.createElement('p');desc.textContent=[d.filename,d.status,d.expires_on?'Expires '+d.expires_on:'',d.review_note].filter(Boolean).join(' · ');card.append(title,desc);history.append(card)}if(!data.documents.length)history.append('No compliance documents submitted yet.')}catch(e){history.textContent=e.message}};load();button.addEventListener('click',()=>setTimeout(load,1000))}],

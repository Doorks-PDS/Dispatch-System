<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Doorks</title>
  <link rel="stylesheet" href="/static/style.css" />

  <style>
    /* Doorks 2.0 — header workspace control; native select retains keyboard accessibility. */
    .platform-switch-wrap {align-items:center;gap:10px;margin-left:0;}
    .platform-switch-label {color:rgba(255,255,255,.82);font-size:10px;font-weight:800;letter-spacing:1.3px;white-space:nowrap;}
    .platform-select-shell {position:relative;display:inline-flex;align-items:center;min-width:135px;max-width:180px;}
    .platform-select {appearance:none;-webkit-appearance:none;width:100%;border:1px solid rgba(255,255,255,.5);border-radius:999px;background:rgba(109,43,0,.24);color:#fff;font-size:13px;font-weight:750;line-height:1.2;padding:9px 33px 9px 15px;box-shadow:0 2px 8px rgba(113,48,0,.08);cursor:pointer;transition:background .15s,border-color .15s;}
    .platform-select:hover {background:rgba(109,43,0,.38);border-color:#fff;}
    .platform-select:focus-visible {outline:3px solid #fff;outline-offset:3px;}
    .platform-select option {background:#fff;color:#172033;}
    .platform-select-chevron {position:absolute;right:13px;top:50%;transform:translateY(-58%);pointer-events:none;color:#fff;font-size:19px;line-height:1;}
    /* Brand stays geometrically centered regardless of left/right controls. */
    .topbar-inner {position:relative;}
    .topbar-inner > .brand {position:absolute;left:50%;transform:translateX(-50%);margin:0;white-space:nowrap;pointer-events:none;}
    .topbar-inner > .topbar-right {margin-left:auto;display:flex;align-items:center;justify-content:flex-end;min-width:120px;}
    .platform-current-label {display:none;border:1px solid rgba(255,255,255,.5);border-radius:999px;background:rgba(109,43,0,.24);color:white;font-weight:750;font-size:13px;padding:9px 17px;}
    @media(max-width:640px){.topbar-inner > .brand{font-size:24px}.platform-switch-label{display:none!important}.topbar-inner > .topbar-right{min-width:88px}.platform-current-label{padding:8px 12px}}
    @media(max-width:640px){.platform-switch-wrap{margin-left:8px;gap:5px}.platform-switch-label{display:none}.platform-select-shell{min-width:102px}.platform-select{padding:8px 27px 8px 12px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-left">
        <button id="headerCalendarBtn" class="header-calendar-btn" title="Back to Calendar">📅</button>
      </div>
      <div class="brand">Doorks</div>
      <div class="topbar-right">
        <div id="platformSwitchWrap" class="platform-switch-wrap" style="display:none;">
          <span class="platform-switch-label">WORKSPACE</span>
          <span class="platform-select-shell">
            <select id="platformSelect" class="platform-select" aria-label="Select business platform">
              <option value="pds">PDS</option><option value="doorks">Doorks</option><option value="sdc">SDC</option>
            </select><span class="platform-select-chevron" aria-hidden="true">⌄</span>
          </span>
        </div>
        <span id="platformCurrentLabel" class="platform-current-label" aria-label="Current workspace">PDS</span>
        <span id="activeModeChip" style="display:none;" aria-hidden="true"></span>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section class="panel">
        <div class="panel-hd static"><span>Job Flow</span></div>
        <div class="panel-bd" style="display:block;">
          <div class="navcol">
            <button class="navbtn" id="navJobFlow">
              <span>Job Flow</span>
              <small>By Status</small>
              <span class="badge" id="badgeJobFlow" style="display:none;">0</span>
            </button>

            <button class="navbtn" id="navEstimatePage" style="display:none;">
              <span>Estimate</span>
              <small>PDF</small>
            </button>

            <button class="navbtn" id="navInvoicePage" style="display:none;">
              <span>Invoice</span>
              <small>PDF</small>
            </button>

            <button class="navbtn" id="navEstimateInvoice">
              <span>Estimate / Invoice</span>
              <small>Generator</small>
            </button>

            <button class="navbtn" id="navCustomers">
              <span>Customers</span>
              <small>Database</small>
            </button>

            <button class="navbtn" id="navContacts" style="display:none;">
              <span>Contacts</span>
              <small>Database</small>
            </button>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-hd static"><span>Office Flow</span></div>
        <div class="panel-bd" style="display:block;">
          <div class="navcol">
            <button class="navbtn" id="navDataCenter">
              <span>Data Center</span>
              <small>Productivity Dashboard</small>
            </button>

            <button class="navbtn" id="navAccounting"><span>Accounting</span><small>Expenses &amp; Receivables</small></button>

            <button class="navbtn" id="navPayroll">
              <span>Payroll</span>
              <small>Monthly Totals</small>
            </button>

            <button class="navbtn" id="navEmployees">
              <span>Employees</span>
              <small>Users</small>
            </button>

            <button class="navbtn" id="navDataUpload">
              <span>Data Upload</span>
              <small>Admin CSV Uploads</small>
            </button>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-hd static">
          <span>Forms</span>
          
        </div>
        <div class="panel-bd" id="formsBody" style="display:block;">
          <div class="navcol">
            <button class="navbtn" id="navFormsSignOff">
              <span>Sign Off</span>
              <small>PDF + Signature</small>
            </button>

            <button class="navbtn" id="navFormsTimeCard">
              <span>Time Card</span>
              <small>Fillable</small>
            </button>

            <button class="navbtn" id="navFormsReceipts">
              <span>Receipts</span>
              <small>Upload / History</small>
            </button>

            <button class="navbtn" id="navTakeoffs">
              <span>Takeoffs</span>
              <small>Downloads</small>
            </button>
          </div>
        </div>
      </section>

      <section class="panel">
        <button class="panel-hd" id="loginToggle" type="button">
          <span>Login</span>
          <span class="chev" id="loginChev">&#9656;</span>
        </button>
        <div class="panel-bd" id="loginBody" style="display:none;">
          <div class="row" style="display:grid; gap:10px;">
            <input id="usernameInput" class="input" placeholder="Username" autocomplete="username" />
            <input id="passwordInput" type="password" class="input" placeholder="Password" autocomplete="current-password" />
            <div id="pinStepWrap" style="display:none; gap:10px;">
              <input id="pinInput" type="password" inputmode="numeric" maxlength="4" class="input" placeholder="4-digit PIN" autocomplete="one-time-code" />
            </div>
            <div class="row">
              <button id="loginBtn" class="btn btn-orange">Next</button>
              <button id="pinBtn" class="btn btn-orange" type="button" style="display:none;">Verify PIN</button>
              <button id="logoutBtn" class="btn" type="button" style="display:none;">Log Out</button>
            </div>
            <div class="hint" id="loginStatus">Log in to access Doorks.</div>
          </div>
        </div>
      </section>
    </aside>

    <section class="workspace">
      <div class="workspace-hd">
        <div class="workspace-title" id="workspaceTitle">Calendar</div>
        <div class="workspace-actions" id="workspaceActions"></div>
      </div>
      <div class="workspace-bd" id="workspaceBody"></div>
    </section>
  </main>

  <button
    id="navNotifications"
    class="btn btn-orange"
    type="button"
    title="Priority Door Systems Notifications"
    style="position:fixed; right:20px; bottom:20px; z-index:9999; border-radius:999px; min-width:64px; min-height:64px; box-shadow:0 8px 24px rgba(0,0,0,.25);"
  >
    <span style="display:flex; align-items:center; justify-content:center; gap:8px; font-weight:700;">
      <span>PDS</span>
      <span class="badge" id="badgeNotifications" style="display:none;">0</span>
    </span>
  </button>

  <script src="/static/app.js?v=DOORKS16_ACCOUNTING_20261027_V1"></script>
</body>
</html>
